function b64uToBytes(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";const bin=atob(s);return Uint8Array.from(bin,c=>c.charCodeAt(0))}
function devId(){let d=LSG("ln_dev");if(!d||!/^[A-Z0-9]{8}$/.test(d)){const A="ABCDEFGHJKMNPQRSTUVWXYZ23456789",r=crypto.getRandomValues(new Uint8Array(8));d=[...r].map(x=>A[x%A.length]).join("");LSG("ln_dev",d)}return d}
const devFmt=d=>d.slice(0,4)+"-"+d.slice(4);
function fechaRef(){const t=hoy(),seen=LSG("ln_seen")||"";if(seen>t)return seen;LSG("ln_seen",t);return t}
async function licCheck(code){
  try{code=String(code||"").replace(/\s+/g,"");const [p,sg]=code.split(".");if(!p||!sg)return{st:"bad"};
    pubKey=pubKey||await crypto.subtle.importKey("jwk",{...PUB,ext:true},{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);
    if(!await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},pubKey,b64uToBytes(sg),new TextEncoder().encode(p)))return{st:"bad"};
    const d=JSON.parse(new TextDecoder().decode(b64uToBytes(p)));
    if(d.d!==devId())return{st:"dev",n:d.n};
    const t=fechaRef();if(d.e&&t>d.e)return{st:"exp",n:d.n,e:d.e};
    return{st:"ok",n:d.n||"",e:d.e||""}}
  catch(e){return{st:"bad"}}}
async function licInit(){const c=LSG("ln_lic");S.lic=c?await licCheck(c):{st:"none"};S.gate=S.lic.st==="ok"?"ok":S.lic.st==="exp"?"vencido":"sin"}

async function guardarArchivo(filename,data,ok){
  try{const type=filename.endsWith(".csv")?"text/csv":"application/json";const f=new File([data],filename,{type});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:filename});ok&&ok();return}}
  catch(e){if(e&&e.name==="AbortError")return}
  try{const b=new Blob([data],{type:filename.endsWith(".csv")?"text/csv;charset=utf-8":"application/json"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);ok&&ok();return}catch(e){}

/* ---------- Cálculos ---------- */
const enC=m=>m.moneda==="USD"?(+m.monto||0)*(+S.cfg.tc||0):(+m.monto||0);
const movsDe=mes=>Object.values(S.movs).filter(m=>(m.fecha||"").slice(0,7)===mes);
function sumMes(mes){let i=0,g=0;movsDe(mes).forEach(m=>{m.tipo==="ingreso"?i+=enC(m):g+=enC(m)});return {i,g,r:i-g}}
function saldo(c){return r2((+c.monto||0)-(c.abonos||[]).reduce((a,b)=>a+(+b.monto||0),0))}
function estado(c){const s=saldo(c);if(s<=0.005)return "pagado";if(c.vence&&c.vence<hoy())return "vencido";return "pendiente"}
function irAnual(r){for(const [a,b,base,p] of IR_TABLA){if(r<=b)return r<=a?0:base+(r-a)*p}return 0}
function minimoDe(sector){const x=MINIMOS.find(m=>m[0]===sector);return x?x[2]:0}
function calcLinea(emp,he,otros,ded,tipo){
  const q=tipo!=="M",div=q?2:1,per=q?24:12;
  const sal=(+emp.salario||0)/div;
  const vh=(+emp.salario||0)/30/8;
  const pHE=(+he||0)*vh*2;
  const bruto=sal+pHE+(+otros||0);
  const inss=bruto*S.cfg.inssLab/100;
  const ir=irAnual((bruto-inss)*per)/per;
  const neto=bruto-inss-ir-(+ded||0);
  const pat=bruto*S.cfg.inssPat/100,inatec=bruto*S.cfg.inatec/100;
  return {empId:emp.id,nombre:emp.nombre,cargo:emp.cargo||"",salario:r2(sal),he:+he||0,pHE:r2(pHE),otros:r2(otros),bruto:r2(bruto),inss:r2(inss),ir:r2(ir),ded:r2(ded),neto:r2(neto),pat:r2(pat),inatec:r2(inatec)};
}
function totNom(lines){const t={bruto:0,inss:0,ir:0,ded:0,neto:0,pat:0,inatec:0};lines.forEach(l=>Object.keys(t).forEach(k=>t[k]+=l[k]||0));Object.keys(t).forEach(k=>t[k]=r2(t[k]));t.costo=r2(t.bruto+t.pat+t.inatec);return t}
function prestaciones(e){
  const h=hoy(),sal=+e.salario||0;
  if(!e.ingreso)return null;
  const d=Math.max(0,dias(e.ingreso,h));
  const anios=d/365;
  const vacAcum=Math.max(0,(d/30)*2.5-(+e.vacTomadas||0));
  const y=+h.slice(0,4);
  let ini=(h>=y+"-12-01")?y+"-12-01":(y-1)+"-12-01";
  if(e.ingreso>ini)ini=e.ingreso;
  const dAg=Math.min(360,Math.max(0,dias(ini,h)));
  const ag=sal*dAg/360;
  let ind=anios<=3?anios*sal:3*sal+(anios-3)*sal*20/30;
  ind=Math.min(ind,5*sal);
  return {anios,vacDias:vacAcum,vacMonto:vacAcum*sal/30,ag,ind,iniAg:ini};
}
function antig(a){const y=Math.floor(a),m=Math.floor((a-y)*12);return (y?y+(y===1?" año":" años"):"")+(y&&m?" ":"")+(m||!y?m+(m===1?" mes":" meses"):"")}

function vCaja(){
  let ms=movsDe(S.mes);
  if(S.cajaFiltro!=="todo")ms=ms.filter(m=>m.tipo===S.cajaFiltro);
  ms.sort((a,b)=>(b.fecha+(b.creado||"")).localeCompare(a.fecha+(a.creado||"")));
  const t=sumMes(S.mes);
  const grupos={};ms.forEach(m=>(grupos[m.fecha]=grupos[m.fecha]||[]).push(m));
  const html=Object.keys(grupos).map(f=>{const g=grupos[f];const net=g.reduce((a,m)=>a+(m.tipo==="ingreso"?1:-1)*enC(m),0);
    return `<div class="dayhead"><span>${fechaCorta(f).toUpperCase()}</span><span class="num">${net>=0?"+":""}${C(net)}</span></div>`+g.map(m=>`<button class="item" data-act="editMov" data-id="${m.id}"><span class="dot" style="background:var(--${m.tipo==="ingreso"?"in":"out"})"></span><div class="main"><div class="t">${esc(m.descripcion||m.categoria)}${m.ejemplo?' <span class="chip neu">Ejemplo</span>':""}</div><div class="s">${esc(m.categoria)} · ${esc(m.metodo)}${m.moneda==="USD"?" · "+U(m.monto):""}</div></div><span class="num ${m.tipo==="ingreso"?"in-c":"out-c"}">${m.tipo==="ingreso"?"+":"−"}${C(enC(m))}</span></button>`).join("")}).join("");
  return `<h2>Caja · ${esc(mesLbl(S.mes))}</h2>
  <div class="kpis"><div class="kpi"><div class="l">Entró</div><div class="v in-c">${C(t.i)}</div></div><div class="kpi"><div class="l">Salió</div><div class="v out-c">${C(t.g)}</div></div><div class="kpi"><div class="l">Saldo del mes</div><div class="v">${C(t.r)}</div></div></div>
  <div class="spread" style="margin:14px 0 10px"><div class="seg">${[["todo","Todo"],["ingreso","Ingresos"],["gasto","Gastos"]].map(([k,l])=>`<button data-act="cajaF" data-k="${k}" class="${S.cajaFiltro===k?"on":""}">${l}</button>`).join("")}</div><button class="btn sm" data-act="csv">Exportar CSV</button></div>
  <div class="list">${html||`<div class="empty">No hay movimientos en ${esc(mesLbl(S.mes))}. Tocá “+ Movimiento” para registrar una venta o un gasto.</div>`}</div>`;
}

function vNomina(){
  const emps=Object.values(S.emps).sort((a,b)=>(a.nombre||"").localeCompare(b.nombre||""));
  const act=emps.filter(e=>e.activo!==false);
  let body="";
  if(S.nomTab==="emps"){
    body=`<div class="muted" style="font-size:13px;margin-bottom:8px">${act.length} de ${MAX_EMP} trabajadores activos</div><div class="list">${emps.length?emps.map(e=>{const p=prestaciones(e),min=minimoDe(e.sector);const bajo=min&&(+e.salario<min);
      return `<button class="item" data-act="verEmp" data-id="${e.id}"><div class="main"><div class="t">${esc(e.nombre)}${e.ejemplo?' <span class="chip neu">Ejemplo</span>':""}</div><div class="s">${esc(e.cargo||"Sin cargo")}${p?" · "+antig(p.anios):""}</div></div>${e.activo===false?'<span class="chip neu">Inactivo</span>':bajo?'<span class="chip bad">Bajo el mínimo</span>':""}<span class="num">${C(e.salario)}</span></button>`}).join(""):`<div class="empty">Todavía no hay empleados. Agregá hasta ${MAX_EMP} trabajadores con su salario y fecha de ingreso.</div>`}</div>`;
  }else{
    const noms=Object.values(S.noms).sort((a,b)=>b.id.localeCompare(a.id));
    body=`<div class="list">${noms.length?noms.map(n=>{const t=totNom(n.lineas||[]);return `<button class="item" data-act="verNom" data-id="${n.id}"><div class="main"><div class="t">${esc(nomLbl(n))}${n.ejemplo?' <span class="chip neu">Ejemplo</span>':""}</div><div class="s">${(n.lineas||[]).length} trabajadores · neto ${C(t.neto)}</div></div>${n.movId?'<span class="chip ok">En caja</span>':'<span class="chip warn">Sin registrar</span>'}<span class="num">${C(t.costo)}</span></button>`}).join(""):`<div class="empty">Aún no hay planillas. Creá la planilla del mes y la app calcula INSS, IR, INATEC y el neto a pagar.</div>`}</div>`;
  }
  return `<h2>Nómina</h2><div class="seg" style="display:inline-flex;margin-bottom:12px">${[["emps","Empleados"],["plan","Planillas"]].map(([k,l])=>`<button data-act="nomT" data-k="${k}" class="${S.nomTab===k?"on":""}">${l}</button>`).join("")}</div>${body}
  <h3>Cómo se calcula</h3><div class="panel" style="font-size:13px;line-height:1.55">INSS laboral ${S.cfg.inssLab}% del salario bruto. IR salarial con la tabla progresiva anual sobre el salario neto de INSS, proyectado a 12 meses (o 24 quincenas). Horas extra pagadas al doble del valor hora (salario ÷ 30 ÷ 8). El empleador aporta INSS patronal ${S.cfg.inssPat}% e INATEC ${S.cfg.inatec}%. Prestaciones: vacaciones de 15 días por semestre, aguinaldo de un mes por año (se paga en los primeros 10 días de diciembre) e indemnización por antigüedad del Art. 45 (tope de 5 meses).</div>`;
}
function nomLbl(n){return mesLbl(n.periodo)+(n.tipo==="Q1"?" · 1ª quincena":n.tipo==="Q2"?" · 2ª quincena":" · mensual")}

function vCuentas(col){
  const cx=col==="cxc";
  const arr=Object.values(S[col]);
  const abiertas=arr.filter(c=>estado(c)!=="pagado").sort((a,b)=>(a.vence||"9").localeCompare(b.vence||"9"));
  const cerradas=arr.filter(c=>estado(c)==="pagado").sort((a,b)=>(b.vence||"").localeCompare(a.vence||""));
  const h=hoy(),b=[0,0,0,0];
  abiertas.forEach(c=>{const d=c.vence?dias(c.vence,h):0;const s=saldo(c);if(d<=0)b[0]+=s;else if(d<=30)b[1]+=s;else if(d<=60)b[2]+=s;else b[3]+=s});
  const tot=b.reduce((a,x)=>a+x,0);
  const row=c=>`<button class="item" data-act="verCuenta" data-col="${col}" data-id="${c.id}"><div class="main"><div class="t">${esc(c.nombre)}${c.ejemplo?' <span class="chip neu">Ejemplo</span>':""}</div><div class="s">${esc(c.concepto||"")}${c.vence?" · vence "+fechaCorta(c.vence):""}</div></div>${chipEstado(c)}<span class="num">${C(estado(c)==="pagado"?c.monto:saldo(c))}</span></button>`;
  return `<h2>${cx?"Cuentas por cobrar":"Cuentas por pagar"}</h2>
  <div class="panel"><div class="muted" style="font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase">${cx?"Total que te deben":"Total que debés"}</div><div class="num" style="font-size:22px">${C(tot)}</div>
  <div class="aging"><div><div class="l">Al día</div><div class="v">${C(b[0])}</div></div><div><div class="l">1–30 días</div><div class="v">${C(b[1])}</div></div><div><div class="l">31–60 días</div><div class="v">${C(b[2])}</div></div><div><div class="l">Más de 60</div><div class="v">${C(b[3])}</div></div></div></div>
  <h3>Abiertas (${abiertas.length})</h3><div class="list">${abiertas.length?abiertas.map(row).join(""):`<div class="empty">${cx?"Nadie te debe nada. Registrá aquí las ventas al crédito.":"No tenés deudas pendientes. Registrá aquí las facturas de proveedores."}</div>`}</div>
  ${cerradas.length?`<h3>Pagadas (${cerradas.length})</h3><div class="list">${cerradas.slice(0,20).map(row).join("")}</div>`:""}`;
}

let AJ=new Set();try{AJ=new Set(JSON.parse(LSG("ln_aj")||"[]"))}catch(e){}
function ajSec(k,on){if(on===undefined)on=!AJ.has(k);on?AJ.add(k):AJ.delete(k);LSG("ln_aj",JSON.stringify([...AJ]));const el=document.getElementById("aj-"+k);if(el){el.classList.toggle("op",on);const b=el.querySelector(".ah");if(b)b.setAttribute("aria-expanded",on)}}
function vAjustes(){
  const c=S.cfg;
  const tema=c.tema||"auto",mods=c.mods!==false;
  const temaN=(TEMAS.find(x=>x[0]===tema)||TEMAS[0])[1];
  const ur=c.ultimoRespaldo;
  const sec=(k,ico,col,tit,sub,body)=>`<div class="acc ${AJ.has(k)?"op":""}" id="aj-${k}"><button class="ah" data-act="ajSec" data-k="${k}" aria-expanded="${AJ.has(k)}"><span class="ai" style="background:var(${col})">${ico}</span><span class="at"><b>${tit}</b><small>${sub}</small></span><span class="chev">›</span></button><div class="ab">${body}</div></div>`;
  return `<h2>Ajustes</h2>
  ${sec("apa","◐","--m-nomina","Apariencia",esc(temaN)+(mods?" · colores por módulo":""),`
    <div class="temas">${TEMAS.map(([k,n,d,col])=>`<button class="tema ${tema===k?"on":""}" data-act="tema" data-k="${k}" aria-pressed="${tema===k}"><span class="sw">${col.map(x=>`<i style="background:${x}"></i>`).join("")}</span><span><b>${n}</b><br><small>${d}</small></span></button>`).join("")}</div>
    <div class="spread" style="margin-top:12px"><div><b style="font-size:14px">Colores por módulo</b><div class="mods-row" style="margin-top:6px">${[["Panel","panel"],["Caja","caja"],["Nómina","nomina"],["Cobrar","cobrar"],["Pagar","pagar"]].map(([n,k])=>`<span style="background:var(--m-${k});color:var(--accent-ink)">${n}</span>`).join("")}</div></div>
    <button class="btn sm ${mods?"pri":""}" data-act="mods" aria-pressed="${mods}">${mods?"Activados":"Desactivados"}</button></div>`)}
  ${sec("neg","C$","--m-panel","Negocio y tasas",esc(c.negocio)+" · TC "+(+c.tc||0),`
    <form class="f" id="fCfg">
    <label>Nombre del negocio<input id="cNeg" value="${esc(c.negocio)}" required></label>
    <div class="two"><label>INSS laboral %<input id="cLab" type="number" step="0.01" value="${c.inssLab}"></label><label>INSS patronal %<input id="cPat" type="number" step="0.01" value="${c.inssPat}"></label></div>
    <div class="two"><label>INATEC %<input id="cIna" type="number" step="0.01" value="${c.inatec}"></label><label>Tipo de cambio C$ por US$<input id="cTc" type="number" step="0.0001" value="${c.tc}"></label></div>
    <div class="muted" style="font-size:12px">Con 10 trabajadores o menos aplica el INSS patronal de 21.5%. Verificá el tipo de cambio oficial del BCN.</div>
    <div class="actions"><button class="btn pri" type="submit">Guardar ajustes</button></div>
    </form>`)}
  ${sec("acc","⚿","--m-cobrar","Tu acceso",S.lic&&S.lic.e?"Vence el "+esc(fechaCorta(S.lic.e))+" "+esc(S.lic.e.slice(0,4)):"Sin vencimiento",`
    <div style="display:grid;gap:10px">
    <div class="facts" style="margin:0"><div><span>A nombre de</span><span>${esc((S.lic&&S.lic.n)||"—")}</span></div><div><span>Vence</span><span>${S.lic&&S.lic.e?esc(fechaCorta(S.lic.e))+" "+esc(S.lic.e.slice(0,4)):"Sin vencimiento"}</span></div><div><span>ID del teléfono</span><span class="num">${devFmt(devId())}</span></div></div>
    <div class="row"><button class="btn sm" data-act="waId">Pedir renovación por WhatsApp</button></div>
    <form class="f" id="fCode"><label>Cargar código nuevo (renovación)<textarea id="codeIn" rows="2" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea></label><div id="codeMsg"></div><div class="actions"><button class="btn" type="submit">Activar código</button></div></form>
    </div>`)}
  ${sec("res","⇅","--m-caja","Respaldo de tus datos",ur?"Último: "+fechaCorta(ur)+" "+ur.slice(0,4):"Todavía no hiciste un respaldo",`
    <div style="display:grid;gap:10px">
    <div style="font-size:14px">Tus datos se guardan solo en este teléfono. Descargá un respaldo seguido y guardalo en Archivos, Drive o WhatsApp. Con ese archivo recuperás todo en otro teléfono.</div>
    <div class="row"><button class="btn pri" data-act="respaldo">Descargar respaldo</button></div>

      <label>Restaurar desde archivo<input type="file" id="rFile" accept=".json,application/json"></label>
      <label>…o pegá el texto del respaldo<textarea id="rTxt" rows="2"></textarea></label>
      <div id="rMsg"></div>
      <div class="actions"><button class="btn" type="submit" id="rBtn">Restaurar</button></div>
    </form></div>`)}
  ${sec("ir","%","--m-pagar","Tabla de IR salarial","Tarifa progresiva anual",`
    <div class="tbl"><table><tr><th>Desde</th><th>Hasta</th><th>Impuesto base</th><th>% sobre exceso</th></tr>${IR_TABLA.map(([a,b,base,p])=>`<tr><td class="num">${C(a)}</td><td>${b===Infinity?"En adelante":C(b)}</td><td>${C(base)}</td><td>${p*100}%</td></tr>`).join("")}</table></div>`)}

  <p class="muted" style="font-size:12px;margin-top:18px">Esta app es una herramienta de registro y cálculo. Confirmá declaraciones al INSS y a la DGI con tu contador.</p>`;

/* ---------- Modales ---------- */
function openModal(html,mount){
  $("#modal").innerHTML=`<div class="sheet-bg" data-act="bg"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const first=$("#modal").querySelector("input,select,textarea");
  if(mount)mount($("#modal"));
  if(first&&window.innerWidth>700)first.focus();
}
function closeModal(){$("#modal").innerHTML=""}
function opts(arr,sel){return arr.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${v===sel?"selected":""}>${esc(l)}</option>`}).join("")}
function delBtn(){return `<button type="button" class="btn danger" data-act="armDel">Eliminar</button>`}

function formMov(m){
  const n=!m;m=m||{tipo:"ingreso",fecha:hoy(),moneda:"NIO",metodo:"Efectivo",categoria:"Ventas"};
  openModal(`<h2>${n?"Nuevo movimiento":"Editar movimiento"}</h2>
  <form class="f" id="fMov">
    <div class="seg" style="justify-self:start"><button type="button" data-t="ingreso" class="${m.tipo==="ingreso"?"on":""}">Ingreso</button><button type="button" data-t="gasto" class="${m.tipo==="gasto"?"on":""}">Gasto</button></div>
    <div class="two"><label>Monto<input id="mMonto" type="number" step="0.01" min="0.01" inputmode="decimal" value="${m.monto||""}" required></label><label>Moneda<select id="mMon">${opts([["NIO","Córdobas C$"],["USD","Dólares US$"]],m.moneda)}</select></label></div>
    <div class="two"><label>Fecha<input id="mFecha" type="date" value="${m.fecha}" required></label><label>Método<select id="mMet">${opts(METODOS,m.metodo)}</select></label></div>
    <label>Categoría<select id="mCat"></select></label>
    <label>Descripción<input id="mDesc" value="${esc(m.descripcion||"")}" placeholder="Ej.: Venta de mostrador"></label>
    <div class="actions">${n?"":delBtn()}<button type="button" class="btn" data-act="close">Cancelar</button><button class="btn pri" type="submit">Guardar</button></div>
  </form>`,root=>{
    let tipo=m.tipo;const cat=root.querySelector("#mCat");
    const fill=()=>{const list=tipo==="ingreso"?CAT_IN:CAT_OUT;cat.innerHTML=opts(list,list.includes(m.categoria)?m.categoria:list[0])};fill();
    root.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tipo=b.dataset.t;root.querySelectorAll("[data-t]").forEach(x=>x.classList.toggle("on",x===b));fill()});
    root.querySelector("#fMov").onsubmit=e=>{e.preventDefault();
      const id=m.id||uid();
      put("movs",id,{...m,tipo,monto:r2(root.querySelector("#mMonto").value),moneda:root.querySelector("#mMon").value,fecha:root.querySelector("#mFecha").value,metodo:root.querySelector("#mMet").value,categoria:cat.value,descripcion:root.querySelector("#mDesc").value.trim(),creado:m.creado||new Date().toISOString()});
      closeModal();toast(n?"Movimiento guardado":"Cambios guardados")};
    armDelete(root,()=>{del("movs",m.id);closeModal();toast("Movimiento eliminado")});
  });
}

function armDelete(root,fn){const b=root.querySelector('[data-act="armDel"]');if(!b)return;b.onclick=e=>{e.stopPropagation();if(b.dataset.armed){fn()}else{b.dataset.armed="1";b.textContent="Tocá de nuevo para eliminar"}}}

function formEmp(e){
  const n=!e;
  if(n&&Object.values(S.emps).filter(x=>x.activo!==false).length>=MAX_EMP){toast("Llegaste al máximo de "+MAX_EMP+" trabajadores activos");return}
  e=e||{sector:"comercio",ingreso:hoy(),activo:true,vacTomadas:0};
  openModal(`<h2>${n?"Nuevo empleado":"Editar empleado"}</h2>
  <form class="f" id="fEmp">
    <label>Nombre completo<input id="eNom" value="${esc(e.nombre||"")}" required></label>
    <div class="two"><label>Cédula<input id="eCed" value="${esc(e.cedula||"")}" placeholder="001-010190-0001A"></label><label>N.º INSS<input id="eInss" value="${esc(e.inss||"")}"></label></div>
    <div class="two"><label>Cargo<input id="eCargo" value="${esc(e.cargo||"")}"></label><label>Fecha de ingreso<input id="eIng" type="date" value="${e.ingreso}" required></label></div>
    <label>Sector (salario mínimo)<select id="eSec">${opts(MINIMOS.map(m=>[m[0],m[1]+" — "+C(m[2])]),e.sector)}</select></label>
    <div class="two"><label>Salario mensual C$<input id="eSal" type="number" step="0.01" min="0" inputmode="decimal" value="${e.salario||""}" required></label><label>Vacaciones ya tomadas (días)<input id="eVac" type="number" step="0.5" min="0" value="${e.vacTomadas||0}"></label></div>
    <div id="eWarn"></div>
    <label class="chk"><input id="eAct" type="checkbox" ${e.activo!==false?"checked":""}> Trabajador activo</label>
    <div class="actions">${n?"":delBtn()}<button type="button" class="btn" data-act="close">Cancelar</button><button class="btn pri" type="submit">Guardar</button></div>
  </form>`,root=>{
    const chk=()=>{const min=minimoDe(root.querySelector("#eSec").value),s=+root.querySelector("#eSal").value;root.querySelector("#eWarn").innerHTML=s&&s<min?`<div class="notice" style="margin:0"><b>Bajo el mínimo.</b> El salario mínimo de este sector es ${C(min)} al mes.</div>`:""};
    root.querySelector("#eSec").onchange=chk;root.querySelector("#eSal").oninput=chk;chk();
    root.querySelector("#fEmp").onsubmit=ev=>{ev.preventDefault();
      const act=root.querySelector("#eAct").checked;
      if(act&&e.activo===false&&Object.values(S.emps).filter(x=>x.activo!==false).length>=MAX_EMP){toast("Ya tenés "+MAX_EMP+" trabajadores activos");return}
      const id=e.id||uid();
      put("emps",id,{...e,nombre:root.querySelector("#eNom").value.trim(),cedula:root.querySelector("#eCed").value.trim(),inss:root.querySelector("#eInss").value.trim(),cargo:root.querySelector("#eCargo").value.trim(),ingreso:root.querySelector("#eIng").value,sector:root.querySelector("#eSec").value,salario:r2(root.querySelector("#eSal").value),vacTomadas:+root.querySelector("#eVac").value||0,activo:act});
      closeModal();toast("Empleado guardado")};
    armDelete(root,()=>{del("emps",e.id);closeModal();toast("Empleado eliminado")});
  });
}

function verEmp(e){
  const p=prestaciones(e),min=minimoDe(e.sector);
  openModal(`<div class="spread"><h2 style="margin:0">${esc(e.nombre)}</h2>${e.activo===false?'<span class="chip neu">Inactivo</span>':'<span class="chip ok">Activo</span>'}</div>
  <div class="muted" style="font-size:14px;margin-top:4px">${esc(e.cargo||"Sin cargo")}${e.cedula?" · Cédula "+esc(e.cedula):""}${e.inss?" · INSS "+esc(e.inss):""}</div>
  <div class="facts">
    <div><span>Salario mensual</span><span class="num">${C(e.salario)}</span></div>
    <div><span>Mínimo del sector</span><span class="num ${+e.salario<min?"out-c":""}">${C(min)}</span></div>
    <div><span>Ingreso</span><span>${e.ingreso?fechaCorta(e.ingreso)+" "+e.ingreso.slice(0,4):"—"}</span></div>
    <div><span>Antigüedad</span><span>${p?antig(p.anios):"—"}</span></div>
  </div>
  ${p?`<h3>Prestaciones acumuladas a hoy</h3><div class="lines">
    <div class="spread"><span>Vacaciones pendientes (${p.vacDias.toFixed(1)} días)</span><span class="num">${C(p.vacMonto)}</span></div>
    <div class="spread"><span>Aguinaldo desde ${fechaCorta(p.iniAg)} ${p.iniAg.slice(0,4)}</span><span class="num">${C(p.ag)}</span></div>
    <div class="spread"><span>Indemnización Art. 45 (si el empleador termina el contrato)</span><span class="num">${C(p.ind)}</span></div>
    <div class="spread b"><span>Total estimado</span><span class="num">${C(p.vacMonto+p.ag+p.ind)}</span></div></div>
    <p class="muted" style="font-size:12px">Estimación sobre el salario actual. Una liquidación real usa el salario promedio de los últimos 6 meses.</p>`:""}
  <div class="actions"><button class="btn" data-act="close">Cerrar</button><button class="btn pri" data-act="editEmp" data-id="${e.id}">Editar</button></div>`);
}

function formNom(n){
  const act=Object.values(S.emps).filter(e=>e.activo!==false).sort((a,b)=>(a.nombre||"").localeCompare(b.nombre||""));
  if(!n&&!act.length){toast("Primero agregá empleados");S.nomTab="emps";render();return}
  const isNew=!n;
  n=n||{periodo:hoy().slice(0,7),tipo:"M",lineas:[]};
  const prev={};(n.lineas||[]).forEach(l=>prev[l.empId]=l);
  const emps=isNew?act:act.concat(Object.values(S.emps).filter(e=>prev[e.id]&&e.activo===false));
  openModal(`<h2>${isNew?"Nueva planilla":"Editar planilla"}</h2>
  <form class="f" id="fNom">
    <div class="two"><label>Mes<input id="nPer" type="month" value="${n.periodo}" required ${isNew?"":"disabled"}></label><label>Periodo<select id="nTipo" ${isNew?"":"disabled"}>${opts([["M","Mensual"],["Q1","1ª quincena"],["Q2","2ª quincena"]],n.tipo)}</select></label></div>
    ${emps.map(e=>{const l=prev[e.id]||{};return `<div class="empcard" data-emp="${e.id}"><div class="spread"><strong>${esc(e.nombre)}</strong><span class="num muted" data-neto>—</span></div>
      <div class="g"><label>Horas extra<input type="number" min="0" step="0.5" data-f="he" value="${l.he||0}"></label><label>Otros ingresos C$<input type="number" min="0" step="0.01" data-f="otros" value="${l.otros||0}"></label><label>Deducciones C$<input type="number" min="0" step="0.01" data-f="ded" value="${l.ded||0}"></label></div></div>`}).join("")}
    <div class="lines panel" id="nTot"></div>
    <div class="actions"><button type="button" class="btn" data-act="close">Cancelar</button><button class="btn pri" type="submit">Guardar planilla</button></div>
  </form>`,root=>{
    const calc=()=>{const tipo=root.querySelector("#nTipo").value;const lines=[];
      root.querySelectorAll("[data-emp]").forEach(card=>{const e=S.emps[card.dataset.emp];const g=f=>+card.querySelector(`[data-f="${f}"]`).value||0;const l=calcLinea(e,g("he"),g("otros"),g("ded"),tipo);lines.push(l);card.querySelector("[data-neto]").textContent="Neto "+C(l.neto)});
      const t=totNom(lines);
      root.querySelector("#nTot").innerHTML=`<div class="spread"><span>Salarios brutos</span><span class="num">${C(t.bruto)}</span></div><div class="spread"><span>INSS laboral retenido</span><span class="num">${C(t.inss)}</span></div><div class="spread"><span>IR retenido</span><span class="num">${C(t.ir)}</span></div><div class="spread"><span>Neto a pagar</span><span class="num">${C(t.neto)}</span></div><div class="spread"><span>INSS patronal + INATEC</span><span class="num">${C(t.pat+t.inatec)}</span></div><div class="spread b"><span>Costo total</span><span class="num">${C(t.costo)}</span></div>`;
      return lines};
    root.querySelector("#fNom").oninput=calc;root.querySelector("#nTipo").onchange=calc;calc();
    root.querySelector("#fNom").onsubmit=ev=>{ev.preventDefault();
      const per=root.querySelector("#nPer").value,tipo=root.querySelector("#nTipo").value;
      if(!per){toast("Elegí el mes");return}
      const id=isNew?per+"-"+tipo:n.id;
      if(isNew&&S.noms[id]){toast("Esa planilla ya existe. Abrila para editarla.");return}
      put("noms",id,{...n,periodo:per,tipo,lineas:calc(),tasas:{lab:S.cfg.inssLab,pat:S.cfg.inssPat,inatec:S.cfg.inatec}});
      closeModal();S.nomTab="plan";render();toast("Planilla guardada")};
  });
}

function verNom(n){
  const t=totNom(n.lineas||[]);
  openModal(`<h2>${esc(nomLbl(n))}</h2>
  <div class="tbl"><table><tr><th>Trabajador</th><th>Bruto</th><th>INSS</th><th>IR</th><th>Deducc.</th><th>Neto</th></tr>
  ${(n.lineas||[]).map((l,i)=>`<tr><td><button class="btn sm" data-act="colilla" data-id="${n.id}" data-i="${i}">${esc(l.nombre)}</button></td><td>${C(l.bruto)}</td><td>${C(l.inss)}</td><td>${C(l.ir)}</td><td>${C(l.ded)}</td><td>${C(l.neto)}</td></tr>`).join("")}
  <tr class="tot"><td>Total</td><td>${C(t.bruto)}</td><td>${C(t.inss)}</td><td>${C(t.ir)}</td><td>${C(t.ded)}</td><td>${C(t.neto)}</td></tr></table></div>
  <p class="muted" style="font-size:12px">Tocá un nombre para ver su colilla de pago.</p>
  <div class="lines panel">
    <div class="spread"><span>Neto a trabajadores</span><span class="num">${C(t.neto)}</span></div>
    <div class="spread"><span>Al INSS (laboral ${C(t.inss)} + patronal ${C(t.pat)})</span><span class="num">${C(t.inss+t.pat)}</span></div>
    <div class="spread"><span>A la DGI (IR retenido)</span><span class="num">${C(t.ir)}</span></div>
    <div class="spread"><span>INATEC</span><span class="num">${C(t.inatec)}</span></div>
    <div class="spread b"><span>Costo total del periodo</span><span class="num">${C(t.costo)}</span></div>
  </div>
  <div class="actions"><button class="btn danger" data-act="armDel">Eliminar</button><button class="btn" data-act="editNom" data-id="${n.id}">Editar</button>
  ${n.movId&&S.movs[n.movId]?'<span class="chip ok" style="align-self:center">Registrada en caja</span>':`<button class="btn pri" data-act="nomCaja" data-id="${n.id}">Registrar en caja</button>`}</div>`,root=>{
    armDelete(root,()=>{del("noms",n.id);closeModal();toast("Planilla eliminada")});
  });
}

function colilla(n,i){
  const l=n.lineas[i];
  const txt=`${S.cfg.negocio}\nColilla de pago · ${nomLbl(n)}\n${l.nombre}${l.cargo?" · "+l.cargo:""}\n\nSalario: ${C(l.salario)}\nHoras extra (${l.he} h): ${C(l.pHE)}\nOtros ingresos: ${C(l.otros)}\nTotal devengado: ${C(l.bruto)}\n\nINSS laboral: -${C(l.inss)}\nIR: -${C(l.ir)}\nOtras deducciones: -${C(l.ded)}\n\nNETO A RECIBIR: ${C(l.neto)}`;
  openModal(`<div class="muted" style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600">${esc(S.cfg.negocio)} · Colilla de pago</div>
  <h2 style="margin-top:4px">${esc(l.nombre)}</h2><div class="muted" style="font-size:14px;margin:-6px 0 12px">${esc(l.cargo)} · ${esc(nomLbl(n))}</div>
  <h3 style="margin-top:0">Devengado</h3><div class="lines">
   <div class="spread"><span>Salario del periodo</span><span class="num">${C(l.salario)}</span></div>
   <div class="spread"><span>Horas extra (${l.he} h al doble)</span><span class="num">${C(l.pHE)}</span></div>
   <div class="spread"><span>Otros ingresos</span><span class="num">${C(l.otros)}</span></div>
   <div class="spread b"><span>Total devengado</span><span class="num">${C(l.bruto)}</span></div></div>
  <h3>Deducciones</h3><div class="lines">
   <div class="spread"><span>INSS laboral</span><span class="num">${C(l.inss)}</span></div>
   <div class="spread"><span>IR salarial</span><span class="num">${C(l.ir)}</span></div>
   <div class="spread"><span>Otras deducciones</span><span class="num">${C(l.ded)}</span></div></div>
  <div class="panel spread" style="margin-top:14px;background:var(--accent-soft);border-color:var(--accent)"><strong>Neto a recibir</strong><span class="num" style="font-size:20px">${C(l.neto)}</span></div>
  <div class="actions"><button class="btn" data-act="verNomBack" data-id="${n.id}">Volver</button><button class="btn pri" id="cpy">Copiar colilla</button></div>`,root=>{
    root.querySelector("#cpy").onclick=()=>{try{navigator.clipboard.writeText(txt).then(()=>toast("Colilla copiada"),()=>toast("No se pudo copiar"))}catch(e){toast("No se pudo copiar")}};
  });
}

function formCuenta(col,c){
  const cx=col==="cxc",n=!c;c=c||{fecha:hoy(),vence:"",abonos:[]};
  openModal(`<h2>${n?(cx?"Nueva cuenta por cobrar":"Nueva cuenta por pagar"):"Editar cuenta"}</h2>
  <form class="f" id="fCta">
    <label>${cx?"Cliente":"Proveedor"}<input id="kNom" value="${esc(c.nombre||"")}" required></label>
    <label>Concepto / N.º factura<input id="kCon" value="${esc(c.concepto||"")}"></label>
    <label>Monto total C$<input id="kMonto" type="number" step="0.01" min="0.01" inputmode="decimal" value="${c.monto||""}" required></label>
    <div class="two"><label>Fecha<input id="kF" type="date" value="${c.fecha}" required></label><label>Vence<input id="kV" type="date" value="${c.vence||""}"></label></div>
    <label>Teléfono / contacto<input id="kTel" value="${esc(c.contacto||"")}"></label>
    <div class="actions">${n?"":delBtn()}<button type="button" class="btn" data-act="close">Cancelar</button><button class="btn pri" type="submit">Guardar</button></div>
  </form>`,root=>{
    root.querySelector("#fCta").onsubmit=e=>{e.preventDefault();const id=c.id||uid();
      put(col,id,{...c,nombre:root.querySelector("#kNom").value.trim(),concepto:root.querySelector("#kCon").value.trim(),monto:r2(root.querySelector("#kMonto").value),fecha:root.querySelector("#kF").value,vence:root.querySelector("#kV").value,contacto:root.querySelector("#kTel").value.trim()});
      closeModal();toast("Cuenta guardada")};
    armDelete(root,()=>{del(col,c.id);closeModal();toast("Cuenta eliminada")});
  });
}

function verCuenta(col,c){
  const cx=col==="cxc",s=saldo(c);
  openModal(`<div class="spread"><h2 style="margin:0">${esc(c.nombre)}</h2>${chipEstado(c)}</div>
  <div class="muted" style="font-size:14px;margin-top:4px">${esc(c.concepto||"")}${c.contacto?" · "+esc(c.contacto):""}</div>
  <div class="facts"><div><span>Monto</span><span class="num">${C(c.monto)}</span></div><div><span>Saldo</span><span class="num">${C(s)}</span></div><div><span>Fecha</span><span>${fechaCorta(c.fecha)}</span></div><div><span>Vence</span><span>${c.vence?fechaCorta(c.vence):"—"}</span></div></div>
  <h3>${cx?"Cobros recibidos":"Pagos realizados"}</h3>
  <div class="list">${(c.abonos||[]).length?c.abonos.map(a=>`<div class="item"><div class="main"><div class="t">${fechaCorta(a.fecha)}</div><div class="s">${esc(a.metodo||"")}</div></div><span class="num">${C(a.monto)}</span></div>`).join(""):`<div class="empty">Sin abonos todavía.</div>`}</div>
  ${s>0.005?`<h3>Registrar ${cx?"cobro":"pago"}</h3><form class="f" id="fAb">
    <div class="two"><label>Monto C$<input id="aM" type="number" step="0.01" min="0.01" max="${s}" value="${s}" required></label><label>Fecha<input id="aF" type="date" value="${hoy()}" required></label></div>
    <label>Método<select id="aMet">${opts(METODOS,"Efectivo")}</select></label>
    <label class="chk"><input type="checkbox" id="aCaja" checked> Anotar también en caja como ${cx?"ingreso":"gasto"}</label>
    <div class="actions"><button class="btn pri" type="submit">Registrar ${cx?"cobro":"pago"}</button></div></form>`:""}
  <div class="actions" style="margin-top:14px"><button class="btn" data-act="close">Cerrar</button><button class="btn" data-act="editCuenta" data-col="${col}" data-id="${c.id}">Editar</button></div>`,root=>{
    const f=root.querySelector("#fAb");if(!f)return;
    f.onsubmit=e=>{e.preventDefault();const monto=r2(root.querySelector("#aM").value),fecha=root.querySelector("#aF").value,metodo=root.querySelector("#aMet").value;
      if(monto<=0)return;
      const ab={monto,fecha,metodo};
      if(root.querySelector("#aCaja").checked){const mid=uid();ab.movId=mid;
        put("movs",mid,{tipo:cx?"ingreso":"gasto",monto,moneda:"NIO",fecha,metodo,categoria:cx?"Cobro a clientes":"Pago a proveedores",descripcion:(cx?"Cobro: ":"Pago: ")+c.nombre+(c.concepto?" · "+c.concepto:""),creado:new Date().toISOString()})}
      const nc={...c,abonos:[...(c.abonos||[]),ab]};put(col,c.id,nc);
      toast(cx?"Cobro registrado":"Pago registrado");verCuenta(col,S[col][c.id])};
  });
}

/* ---------- Eventos ---------- */
let toastT;
function toast(msg){clearTimeout(toastT);let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}t.textContent=msg;t.hidden=false;toastT=setTimeout(()=>t.hidden=true,2600)}

document.addEventListener("click",ev=>{
  const el=ev.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  if(a==="bg"){if(ev.target===el)closeModal();return}
  switch(a){
    case "tab":S.tab=el.dataset.k;closeModal();render();window.scrollTo(0,0);break;
    case "mes":S.mes=addMes(S.mes,+el.dataset.d);render();break;
    case "close":closeModal();break;
    case "cajaF":S.cajaFiltro=el.dataset.k;render();break;
    case "nomT":S.nomTab=el.dataset.k;render();break;
    case "irNom":S.tab="nomina";S.nomTab="plan";render();window.scrollTo(0,0);break;
    case "nuevoMov":formMov();break;
    case "editMov":formMov(S.movs[id]);break;
    case "nuevoEmp":formEmp();break;
    case "verEmp":verEmp(S.emps[id]);break;
    case "editEmp":formEmp(S.emps[id]);break;
    case "nuevaNom":formNom();break;
    case "verNom":case "verNomBack":verNom(S.noms[id]);break;
    case "editNom":formNom(S.noms[id]);break;
    case "colilla":colilla(S.noms[id],+el.dataset.i);break;
    case "nomCaja":{const n=S.noms[id],t=totNom(n.lineas||[]),mid=uid();
      put("movs",mid,{tipo:"gasto",monto:t.costo,moneda:"NIO",fecha:hoy(),metodo:"Banco",categoria:"Nómina",descripcion:"Planilla "+nomLbl(n)+" (neto, INSS, IR e INATEC)",creado:new Date().toISOString()});
      put("noms",id,{...n,movId:mid});toast("Planilla anotada en caja");verNom(S.noms[id]);break}
    case "nuevaCxc":formCuenta("cxc");break;
    case "nuevaCxp":formCuenta("cxp");break;
    case "verCuenta":verCuenta(el.dataset.col,S[el.dataset.col][id]);break;
    case "editCuenta":formCuenta(el.dataset.col,S[el.dataset.col][id]);break;
    case "borrarEj":if(!el.dataset.armed){el.dataset.armed="1";el.textContent="Tocá de nuevo para confirmar";break}
      COLS.forEach(c=>Object.values(S[c]).filter(x=>x.ejemplo).forEach(x=>del(c,x.id)));toast("Ejemplos borrados");break;
    case "csv":exportCsv();break;
    case "waId":pedirCodigo();break;
    case "ajSec":ajSec(el.dataset.k);break;
    case "irRespaldo":AJ.add("res");LSG("ln_aj",JSON.stringify([...AJ]));S.tab="ajustes";closeModal();render();window.scrollTo(0,0);break;
    case "tema":putCfg({...S.cfg,tema:el.dataset.k});toast("Apariencia cambiada");break;
    case "mods":putCfg({...S.cfg,mods:S.cfg.mods===false});break;
    case "copyId":copiarId();break;
    case "respaldo":{const h=hoy();const data=JSON.stringify({app:"libro-negocio",v:1,fecha:new Date().toISOString(),data:{...snapshot(),cfg:{...S.cfg,ultimoRespaldo:h}}});
      guardarArchivo("respaldo-negocio-"+h+".json",data,()=>{S.cfg={...S.cfg,ultimoRespaldo:h};saveLocal();render();toast("Respaldo listo")});break}
  }
});
let pendRest=null;
function leerRespaldo(txt){
  try{const j=JSON.parse(txt),d=j.data||j;if(!d||typeof d!=="object"||!COLS.some(c=>d[c]))throw 0;return d}catch(e){return null}
}
document.addEventListener("change",ev=>{
  if(ev.target.id!=="rFile")return;const f=ev.target.files[0];if(!f)return;
  f.text().then(t=>{$("#rTxt").value=t;pendRest=null;$("#rMsg").innerHTML="";$("#rBtn").textContent="Restaurar"});
});
document.addEventListener("submit",async ev=>{
  if(ev.target.id==="fCode"){ev.preventDefault();
    const v=$("#codeIn").value.replace(/\s+/g,""),r=await licCheck(v);
    if(r.st!=="ok"){$("#codeMsg").innerHTML=`<div class="notice" style="margin:0"><b>No se activó.</b> ${esc(licMsg(r))}</div>`;return}
    LSG("ln_lic",v);S.lic=r;S.gate="ok";
    if(r.n&&S.cfg.negocio===DEF_CFG.negocio)putCfg({...S.cfg,negocio:r.n});
    render();toast(r.e?"Acceso activo hasta el "+fechaCorta(r.e)+" "+r.e.slice(0,4):"Acceso activo sin vencimiento");return}
  if(ev.target.id==="fRest"){ev.preventDefault();
    const d=leerRespaldo($("#rTxt").value);
    if(!d){$("#rMsg").innerHTML=`<div class="notice" style="margin:0"><b>No es un respaldo válido.</b> Elegí el archivo .json que descargaste de esta app.</div>`;return}
    if(pendRest!==$("#rTxt").value){pendRest=$("#rTxt").value;
      const n=COLS.reduce((a,c)=>a+Object.keys(d[c]||{}).length,0);
      $("#rMsg").innerHTML=`<div class="notice" style="margin:0"><b>Atención.</b> Esto reemplaza los datos de este teléfono por el respaldo (${n} registros). Tocá “Confirmar” para seguir.</div>`;
      $("#rBtn").textContent="Confirmar";return}
    COLS.forEach(c=>S[c]=d[c]||{});S.cfg={...DEF_CFG,...(d.cfg||{})};pendRest=null;saveLocal();render();toast("Respaldo restaurado");return}
  if(ev.target.id!=="fCfg")return;ev.preventDefault();
  putCfg({...S.cfg,negocio:$("#cNeg").value.trim()||"Mi Negocio",inssLab:+$("#cLab").value||0,inssPat:+$("#cPat").value||0,inatec:+$("#cIna").value||0,tc:+$("#cTc").value||0});
  toast("Ajustes guardados");
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});

async function exportCsv(){
  const rows=[["Fecha","Tipo","Categoría","Descripción","Método","Moneda","Monto","Monto C$"]];
  movsDe(S.mes).sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(m=>rows.push([m.fecha,m.tipo,m.categoria,m.descripcion||"",m.metodo,m.moneda,m.monto,r2(enC(m))]));
  const csv="﻿"+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(",")).join("\n");
  guardarArchivo("caja-"+S.mes+".csv",csv);
}

/* ---------- Arranque ---------- */
S.mode="local";S.gate="cargando";loadLocal();render();
licInit().then(render);
document.addEventListener("visibilitychange",async()=>{if(document.visibilityState==="visible"){const was=S.gate;await licInit();if(S.gate!==was||S.gate!=="ok")render()}});
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
})();
</script>
</body>
</html>
