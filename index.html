async function guardarArchivo(filename,data,ok){
  try{const type=filename.endsWith(".csv")?"text/csv":"application/json";const f=new File([data],filename,{type});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:filename});ok&&ok();return}}
  catch(e){if(e&&e.name==="AbortError")return}
  try{const b=new Blob([data],{type:filename.endsWith(".csv")?"text/csv;charset=utf-8":"application/json"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);ok&&ok();return}catch(e){}
  try{await navigator.clipboard.writeText(data);toast("No se pudo descargar aquí. Copié el contenido: pegalo en Notas.");ok&&ok()}
  catch(e){toast("No se pudo descargar ni copiar en esta vista")}
}

const enC=m=>m.moneda==="USD"?(+m.monto||0)*(+S.cfg.tc||0):(+m.monto||0);
const movsDe=mes=>Object.values(S.movs).filter(m=>(m.fecha||"").slice(0,7)===mes);
function sumMes(mes){let i=0,g=0;movsDe(mes).forEach(m=>{m.tipo==="ingreso"?i+=enC(m):g+=enC(m)});return {i,g,r:i-g}}
function saldo(c){return r2((+c.monto||0)-(c.abonos||[]).reduce((a,b)=>a+(+b.monto||0),0))}
function estado(c){const s=saldo(c);if(s<=0.005)return "pagado";if(c.vence&&c.vence<hoy())return "vencido";return "pendiente"}
function irAnual(r){for(const [a,b,base,p] of IR_TABLA){if(r<=b)return r<=a?0:base+(r-a)*p}return 0}
function minimoDe(sector){const x=MINIMOS.find(m=>m[0]===sector);return x?x[2]:0}
function calcLinea(emp,he,otros,ded,tipo){
  const q=tipo!=="M",div=q?2:1,per=q?24:12;
  const sal=(+emp.salario||0)/div;
  const vh=(+emp.salario||0)/30/8;
  const pHE=(+he||0)*vh*2;
  const bruto=sal+pHE+(+otros||0);
  const inss=bruto*S.cfg.inssLab/100;
  const ir=irAnual((bruto-inss)*per)/per;
  const neto=bruto-inss-ir-(+ded||0);
  const pat=bruto*S.cfg.inssPat/100,inatec=bruto*S.cfg.inatec/100;
  return {empId:emp.id,nombre:emp.nombre,cargo:emp.cargo||"",salario:r2(sal),he:+he||0,pHE:r2(pHE),otros:r2(otros),bruto:r2(bruto),inss:r2(inss),ir:r2(ir),ded:r2(ded),neto:r2(neto),pat:r2(pat),inatec:r2(inatec)};
}
function totNom(lines){const t={bruto:0,inss:0,ir:0,ded:0,neto:0,pat:0,inatec:0};lines.forEach(l=>Object.keys(t).forEach(k=>t[k]+=l[k]||0));Object.keys(t).forEach(k=>t[k]=r2(t[k]));t.costo=r2(t.bruto+t.pat+t.inatec);return t}
function prestaciones(e){
  const h=hoy(),sal=+e.salario||0;
  if(!e.ingreso)return null;
  const d=Math.max(0,dias(e.ingreso,h));
  const anios=d/365;
  const vacAcum=Math.max(0,(d/30)*2.5-(+e.vacTomadas||0));
  const y=+h.slice(0,4);
  let ini=(h>=y+"-12-01")?y+"-12-01":(y-1)+"-12-01";
  if(e.ingreso>ini)ini=e.ingreso;
  const dAg=Math.min(360,Math.max(0,dias(ini,h)));
  const ag=sal*dAg/360;
  let ind=anios<=3?anios*sal:3*sal+(anios-3)*sal*20/30;
  ind=Math.min(ind,5*sal);
  return {anios,vacDias:vacAcum,vacMonto:vacAcum*sal/30,ag,ind,iniAg:ini};
}
function antig(a){const y=Math.floor(a),m=Math.floor((a-y)*12);return (y?y+(y===1?" año":" años"):"")+(y&&m?" ":"")+(m||!y?m+(m===1?" mes":" meses"):"")}

function vCuentas(col){

/* ---------- Modales ---------- */
function openModal(html,mount){
  $("#modal").innerHTML=`<div class="sheet-bg" data-act="bg"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const first=$("#modal").querySelector("input,select,textarea");
  if(mount)mount($("#modal"));
  if(first&&window.innerWidth>700)first.focus();
}
function closeModal(){$("#modal").innerHTML=""}
function opts(arr,sel){return arr.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${v===sel?"selected":""}>${esc(l)}</option>`}).join("")}
function delBtn(){return `<button type="button" class="btn danger" data-act="armDel">Eliminar</button>`}

function formMov(m,tipoIni){
  const n=!m;m=m||{tipo:tipoIni||"ingreso",fecha:hoy(),moneda:"NIO",metodo:"Efectivo",categoria:tipoIni==="gasto"?CAT_OUT[0]:"Ventas"};
  openModal(`<h2>${n?"Nuevo movimiento":"Editar movimiento"}</h2>
  <form class="f" id="fMov">
    <div class="seg" style="justify-self:start"><button type="button" data-t="ingreso" class="${m.tipo==="ingreso"?"on":""}">Ingreso</button><button type="button" data-t="gasto" class="${m.tipo==="gasto"?"on":""}">Gasto</button></div>
    <div class="two"><label>Monto<input id="mMonto" type="number" step="0.01" min="0.01" inputmode="decimal" value="${m.monto||""}" required></label><label>Moneda<select id="mMon">${opts([["NIO","Córdobas C$"],["USD","Dólares US$"]],m.moneda)}</select></label></div>
    <div class="two"><label>Fecha<input id="mFecha" type="date" value="${m.fecha}" required></label><label>Método<select id="mMet">${opts(METODOS,m.metodo)}</select></label></div>
    <label>Categoría<select id="mCat"></select></label>
    <div id="mCta" style="display:grid;gap:6px"></div>
    <label>Descripción<input id="mDesc" value="${esc(m.descripcion||"")}" placeholder="Ej.: Venta de mostrador"></label>
    <div class="actions">${n?"":delBtn()}<button type="button" class="btn" data-act="close">Cancelar</button><button class="btn pri" type="submit">Guardar</button></div>
  </form>`,root=>{
    let tipo=m.tipo;const cat=root.querySelector("#mCat");
    const LINK={ingreso:["Cobro a clientes","cxc"],gasto:["Pago a proveedores","cxp"]},cta=root.querySelector("#mCta");
    const upd=()=>{const L=LINK[tipo];if(!L||cat.value!==L[0]){cta.innerHTML="";return}
      const col=L[1],cx=col==="cxc",ab=Object.values(S[col]).filter(c=>estado(c)!=="pagado").sort((a,b)=>(a.nombre||"").localeCompare(b.nombre||""));
      if(!ab.length){cta.innerHTML=`<div class="notice" style="margin:0"><b>${cx?"No tenés clientes con saldo pendiente.":"No tenés proveedores con saldo pendiente."}</b> Primero creá la cuenta en ${cx?"Cobrar":"Pagar"}. Si lo guardás así, queda anotado solo en Caja.</div>`;return}
      cta.innerHTML=`<label>${cx?"¿Qué cliente te pagó?":"¿A qué proveedor le pagaste?"}<select id="mCtaSel" required><option value="">— Elegí ${cx?"el cliente":"el proveedor"} —</option>${ab.map(c=>`<option value="${c.id}">${esc(c.nombre)}${c.concepto?" · "+esc(c.concepto):""} · saldo ${C(saldo(c))}</option>`).join("")}<option value="__no">Ninguno (solo anotar en Caja)</option></select></label><div class="muted" id="mCtaInfo" style="font-size:12.5px">Al guardar, el monto se descuenta del saldo ${cx?"del cliente":"del proveedor"}.</div>`;
      const sel=cta.querySelector("#mCtaSel");sel.onchange=()=>{const c=S[col][sel.value];cta.querySelector("#mCtaInfo").textContent=c?`Saldo actual ${C(saldo(c))}. Al guardar se descuenta de su cuenta.`:sel.value==="__no"?"Se anota solo en Caja, sin tocar ninguna cuenta.":""}};
    const fill=()=>{const list=tipo==="ingreso"?catsIn():catsOut();cat.innerHTML=opts(list,list.includes(m.categoria)?m.categoria:list[0]);upd()};fill();cat.onchange=upd;
    root.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tipo=b.dataset.t;root.querySelectorAll("[data-t]").forEach(x=>x.classList.toggle("on",x===b));fill()});
    root.querySelector("#fMov").onsubmit=e=>{e.preventDefault();
      const L=LINK[tipo],sel=root.querySelector("#mCtaSel");
      if(L&&cat.value===L[0]&&sel&&sel.value&&sel.value!=="__no"){
        const mi=r2(root.querySelector("#mMonto").value),mon=root.querySelector("#mMon").value,mc=mon==="USD"?r2(mi*(+S.cfg.tc||0)):mi;
        if(registrarAbono(L[1],sel.value,mc,root.querySelector("#mFecha").value,root.querySelector("#mMet").value,true,null,root.querySelector("#mDesc").value.trim()+(mon==="USD"?" ("+U(mi)+")":""))){
          if(!n&&S.movs[m.id]){delete S.movs[m.id];saveLocal();render()}closeModal()}
        return}
      const id=m.id||uid();
      put("movs",id,{...m,tipo,monto:r2(root.querySelector("#mMonto").value),moneda:root.querySelector("#mMon").value,fecha:root.querySelector("#mFecha").value,metodo:root.querySelector("#mMet").value,categoria:cat.value,descripcion:root.querySelector("#mDesc").value.trim(),creado:m.creado||new Date().toISOString()});
      closeModal();toast(n?"Movimiento guardado":"Cambios guardados")};
    armDelete(root,()=>{del("movs",m.id);closeModal();toast("Movimiento eliminado")});
  });
}

function armDelete(root,fn){const b=root.querySelector('[data-act="armDel"]');if(!b)return;b.onclick=e=>{e.stopPropagation();if(b.dataset.armed){fn()}else{b.dataset.armed="1";b.textContent="Tocá de nuevo para eliminar"}}}

function formEmp(e){
  const n=!e;
  e=e||{sector:"comercio",ingreso:hoy(),activo:true,vacTomadas:0};
  openModal(`<h2>${n?"Nuevo empleado":"Editar empleado"}</h2>
  <form class="f" id="fEmp">
    <label>Nombre completo<input id="eNom" value="${esc(e.nombre||"")}" required></label>
    <div class="two"><label>Cédula<input id="eCed" value="${esc(e.cedula||"")}" placeholder="001-010190-0001A"></label><label>N.º INSS<input id="eInss" value="${esc(e.inss||"")}"></label></div>
    <div class="two"><label>Cargo<input id="eCargo" value="${esc(e.cargo||"")}"></label><label>Fecha de ingreso<input id="eIng" type="date" value="${e.ingreso}" required></label></div>
    <label>Sector (salario mínimo)<select id="eSec">${opts(MINIMOS.map(m=>[m[0],m[1]+" — "+C(m[2])]),e.sector)}</select></label>
    <div class="two"><label>Salario mensual C$<input id="eSal" type="number" step="0.01" min="0" inputmode="decimal" value="${e.salario||""}" required></label><label>Vacaciones ya tomadas (días)<input id="eVac" type="number" step="0.5" min="0" value="${e.vacTomadas||0}"></label></div>
    <div id="eWarn"></div>
    <label class="chk"><input id="eAct" type="checkbox" ${e.activo!==false?"checked":""}> Trabajador activo</label>
    <div class="actions">${n?"":delBtn()}<button type="button" class="btn" data-act="close">Cancelar</button><button class="btn pri" type="submit">Guardar</button></div>
  </form>`,root=>{
    const chk=()=>{const min=minimoDe(root.querySelector("#eSec").value),s=+root.querySelector("#eSal").value;root.querySelector("#eWarn").innerHTML=s&&s<min?`<div class="notice" style="margin:0"><b>Bajo el mínimo.</b> El salario mínimo de este sector es ${C(min)} al mes.</div>`:""};
    root.querySelector("#eSec").onchange=chk;root.querySelector("#eSal").oninput=chk;chk();
    root.querySelector("#fEmp").onsubmit=ev=>{ev.preventDefault();
      const act=root.querySelector("#eAct").checked;
      const id=e.id||uid();
      put("emps",id,{...e,nombre:root.querySelector("#eNom").value.trim(),cedula:root.querySelector("#eCed").value.trim(),inss:root.querySelector("#eInss").value.trim(),cargo:root.querySelector("#eCargo").value.trim(),ingreso:root.querySelector("#eIng").value,sector:root.querySelector("#eSec").value,salario:r2(root.querySelector("#eSal").value),vacTomadas:+root.querySelector("#eVac").value||0,activo:act});
      closeModal();toast("Empleado guardado")};
    armDelete(root,()=>{del("emps",e.id);closeModal();toast("Empleado eliminado")});
  });
}

function verEmp(e){
  const p=prestaciones(e),min=minimoDe(e.sector);
  openModal(`<div class="spread"><h2 style="margin:0">${esc(e.nombre)}</h2>${e.activo===false?'<span class="chip neu">Inactivo</span>':'<span class="chip ok">Activo</span>'}</div>
  <div class="muted" style="font-size:14px;margin-top:4px">${esc(e.cargo||"Sin cargo")}${e.cedula?" · Cédula "+esc(e.cedula):""}${e.inss?" · INSS "+esc(e.inss):""}</div>
  <div class="facts">
    <div><span>Salario mensual</span><span class="num">${C(e.salario)}</span></div>
    <div><span>Mínimo del sector</span><span class="num ${+e.salario<min?"out-c":""}">${C(min)}</span></div>
    <div><span>Ingreso</span><span>${e.ingreso?fechaCorta(e.ingreso)+" "+e.ingreso.slice(0,4):"—"}</span></div>
    <div><span>Antigüedad</span><span>${p?antig(p.anios):"—"}</span></div>
  </div>
  ${p?`<h3>Prestaciones acumuladas a hoy</h3><div class="lines">
    <div class="spread"><span>Vacaciones pendientes (${p.vacDias.toFixed(1)} días)</span><span class="num">${C(p.vacMonto)}</span></div>
    <div class="spread"><span>Aguinaldo desde ${fechaCorta(p.iniAg)} ${p.iniAg.slice(0,4)}</span><span class="num">${C(p.ag)}</span></div>
    <div class="spread"><span>Indemnización Art. 45 (si el empleador termina el contrato)</span><span class="num">${C(p.ind)}</span></div>
    <div class="spread b"><span>Total estimado</span><span class="num">${C(p.vacMonto+p.ag+p.ind)}</span></div></div>
    <p class="muted" style="font-size:12px">Estimación sobre el salario actual. Una liquidación real usa el salario promedio de los últimos 6 meses.</p>`:""}
  <div class="actions"><button class="btn" data-act="close">Cerrar</button><button class="btn pri" data-act="editEmp" data-id="${e.id}">Editar</button></div>`);
}

function formNom(n){
  const act=Object.values(S.emps).filter(e=>e.activo!==false).sort((a,b)=>(a.nombre||"").localeCompare(b.nombre||""));
  if(!n&&!act.length){toast("Primero agregá empleados");S.nomTab="emps";render();return}
  const isNew=!n;
  n=n||{periodo:hoy().slice(0,7),tipo:"M",lineas:[]};
  const prev={};(n.lineas||[]).forEach(l=>prev[l.empId]=l);
  const emps=isNew?act:act.concat(Object.values(S.emps).filter(e=>prev[e.id]&&e.activo===false));
  openModal(`<h2>${isNew?"Nueva planilla":"Editar planilla"}</h2>
  <form class="f" id="fNom">
    <div class="two"><label>Mes<input id="nPer" type="month" value="${n.periodo}" required ${isNew?"":"disabled"}></label><label>Periodo<select id="nTipo" ${isNew?"":"disabled"}>${opts([["M","Mensual"],["Q1","1ª quincena"],["Q2","2ª quincena"]],n.tipo)}</select></label></div>
    ${emps.map(e=>{const l=prev[e.id]||{};return `<div class="empcard" data-emp="${e.id}"><div class="spread"><strong>${esc(e.nombre)}</strong><span class="num muted" data-neto>—</span></div>
      <div class="g"><label>Horas extra<input type="number" min="0" step="0.5" data-f="he" value="${l.he||0}"></label><label>Otros ingresos C$<input type="number" min="0" step="0.01" data-f="otros" value="${l.otros||0}"></label><label>Deducciones C$<input type="number" min="0" step="0.01" data-f="ded" value="${l.ded||0}"></label></div></div>`}).join("")}
    <div class="lines panel" id="nTot"></div>
    <div class="actions"><button type="button" class="btn" data-act="close">Cancelar</button><button class="btn pri" type="submit">Guardar planilla</button></div>
  </form>`,root=>{
    const calc=()=>{const tipo=root.querySelector("#nTipo").value;const lines=[];
      root.querySelectorAll("[data-emp]").forEach(card=>{const e=S.emps[card.dataset.emp];const g=f=>+card.querySelector(`[data-f="${f}"]`).value||0;const l=calcLinea(e,g("he"),g("otros"),g("ded"),tipo);lines.push(l);card.querySelector("[data-neto]").textContent="Neto "+C(l.neto)});
      const t=totNom(lines);
      root.querySelector("#nTot").innerHTML=`<div class="spread"><span>Salarios brutos</span><span class="num">${C(t.bruto)}</span></div><div class="spread"><span>INSS laboral retenido</span><span class="num">${C(t.inss)}</span></div><div class="spread"><span>IR retenido</span><span class="num">${C(t.ir)}</span></div><div class="spread"><span>Neto a pagar</span><span class="num">${C(t.neto)}</span></div><div class="spread"><span>INSS patronal + INATEC</span><span class="num">${C(t.pat+t.inatec)}</span></div><div class="spread b"><span>Costo total</span><span class="num">${C(t.costo)}</span></div>`;
      return lines};
    root.querySelector("#fNom").oninput=calc;root.querySelector("#nTipo").onchange=calc;calc();
    root.querySelector("#fNom").onsubmit=ev=>{ev.preventDefault();
      const per=root.querySelector("#nPer").value,tipo=root.querySelector("#nTipo").value;
      if(!per){toast("Elegí el mes");return}
      const id=isNew?per+"-"+tipo:n.id;
      if(isNew&&S.noms[id]){toast("Esa planilla ya existe. Abrila para editarla.");return}
      const lineas=calc();let sync=false;
      if(n.movId&&S.movs[n.movId]){const nt=totNom(lineas).costo;if(Math.abs(nt-(+S.movs[n.movId].monto||0))>0.004){S.movs[n.movId]={...S.movs[n.movId],monto:nt};sync=true}}
      put("noms",id,{...n,periodo:per,tipo,lineas,tasas:{lab:S.cfg.inssLab,pat:S.cfg.inssPat,inatec:S.cfg.inatec}});
      if(sync)setTimeout(()=>toast("Planilla guardada y gasto en Caja actualizado"),50);
      closeModal();S.nomTab="plan";render();toast("Planilla guardada")};
  });
}

function verNom(n){
  const t=totNom(n.lineas||[]);
  openModal(`<h2>${esc(nomLbl(n))}</h2>
  <div class="tbl"><table><tr><th>Trabajador</th><th>Bruto</th><th>INSS</th><th>IR</th><th>Deducc.</th><th>Neto</th></tr>
  ${(n.lineas||[]).map((l,i)=>`<tr><td><button class="btn sm" data-act="colilla" data-id="${n.id}" data-i="${i}">${esc(l.nombre)}</button></td><td>${C(l.bruto)}</td><td>${C(l.inss)}</td><td>${C(l.ir)}</td><td>${C(l.ded)}</td><td>${C(l.neto)}</td></tr>`).join("")}
  <tr class="tot"><td>Total</td><td>${C(t.bruto)}</td><td>${C(t.inss)}</td><td>${C(t.ir)}</td><td>${C(t.ded)}</td><td>${C(t.neto)}</td></tr></table></div>
  <p class="muted" style="font-size:12px">Tocá un nombre para ver su colilla de pago.</p>
  <div class="lines panel">
    <div class="spread"><span>Neto a trabajadores</span><span class="num">${C(t.neto)}</span></div>
    <div class="spread"><span>Al INSS (laboral ${C(t.inss)} + patronal ${C(t.pat)})</span><span class="num">${C(t.inss+t.pat)}</span></div>
    <div class="spread"><span>A la DGI (IR retenido)</span><span class="num">${C(t.ir)}</span></div>
    <div class="spread"><span>INATEC</span><span class="num">${C(t.inatec)}</span></div>
    <div class="spread b"><span>Costo total del periodo</span><span class="num">${C(t.costo)}</span></div>
  </div>
  <div class="actions"><button class="btn danger" data-act="armDel">Eliminar</button><button class="btn" data-act="editNom" data-id="${n.id}">Editar</button><button class="btn" data-act="pdf" data-k="planilla" data-id="${n.id}">${ic("pdf")} PDF</button>
  ${n.movId&&S.movs[n.movId]?'<span class="chip ok" style="align-self:center">Registrada en caja</span>':`<button class="btn pri" data-act="nomCaja" data-id="${n.id}">Registrar en caja</button>`}</div>`,root=>{
    armDelete(root,()=>{const mv=n.movId&&S.movs[n.movId];if(mv)delete S.movs[n.movId];del("noms",n.id);closeModal();toast(mv?"Planilla eliminada (y su gasto en Caja)":"Planilla eliminada")});
  });
}

function colilla(n,i){
  const l=n.lineas[i];
  const txt=`${S.cfg.negocio}\nColilla de pago · ${nomLbl(n)}\n${l.nombre}${l.cargo?" · "+l.cargo:""}\n\nSalario: ${C(l.salario)}\nHoras extra (${l.he} h): ${C(l.pHE)}\nOtros ingresos: ${C(l.otros)}\nTotal devengado: ${C(l.bruto)}\n\nINSS laboral: -${C(l.inss)}\nIR: -${C(l.ir)}\nOtras deducciones: -${C(l.ded)}\n\nNETO A RECIBIR: ${C(l.neto)}`;
  openModal(`<div class="muted" style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600">${esc(S.cfg.negocio)} · Colilla de pago</div>
  <h2 style="margin-top:4px">${esc(l.nombre)}</h2><div class="muted" style="font-size:14px;margin:-6px 0 12px">${esc(l.cargo)} · ${esc(nomLbl(n))}</div>
  <h3 style="margin-top:0">Devengado</h3><div class="lines">
   <div class="spread"><span>Salario del periodo</span><span class="num">${C(l.salario)}</span></div>
   <div class="spread"><span>Horas extra (${l.he} h al doble)</span><span class="num">${C(l.pHE)}</span></div>
   <div class="spread"><span>Otros ingresos</span><span class="num">${C(l.otros)}</span></div>
   <div class="spread b"><span>Total devengado</span><span class="num">${C(l.bruto)}</span></div></div>
  <h3>Deducciones</h3><div class="lines">
   <div class="spread"><span>INSS laboral</span><span class="num">${C(l.inss)}</span></div>
   <div class="spread"><span>IR salarial</span><span class="num">${C(l.ir)}</span></div>
   <div class="spread"><span>Otras deducciones</span><span class="num">${C(l.ded)}</span></div></div>
  <div class="panel spread" style="margin-top:14px;background:var(--accent-soft);border-color:var(--accent)"><strong>Neto a recibir</strong><span class="num" style="font-size:20px">${C(l.neto)}</span></div>
  <div class="actions"><button class="btn" data-act="verNomBack" data-id="${n.id}">Volver</button><button class="btn" id="cpy">Copiar</button><button class="btn pri" data-act="pdf" data-k="colilla" data-id="${n.id}" data-i="${i}">${ic("pdf")} PDF</button></div>`,root=>{
    root.querySelector("#cpy").onclick=()=>{try{navigator.clipboard.writeText(txt).then(()=>toast("Colilla copiada"),()=>toast("No se pudo copiar"))}catch(e){toast("No se pudo copiar")}};
  });
}

  <form class="f" id="fCta">
    <label>${cx?"Cliente":"Proveedor"}<input id="kNom" value="${esc(c.nombre||"")}" required></label>

    <label>Monto total C$<input id="kMonto" type="number" step="0.01" min="0.01" inputmode="decimal" value="${c.monto||""}" required></label>
    <div class="two"><label>Fecha<input id="kF" type="date" value="${c.fecha}" required></label><label>Vence<input id="kV" type="date" value="${c.vence||""}"></label></div>

    root.querySelector("#fCta").onsubmit=e=>{e.preventDefault();const id=c.id||uid();

function origenMov(mid){if(!mid)return null;
  const n=Object.values(S.noms).find(x=>x.movId===mid);if(n)return {t:"nom",n};
  for(const col of ["cxc","cxp"])for(const c of Object.values(S[col])){const ix=(c.abonos||[]).findIndex(a=>a.movId===mid);if(ix>=0)return {t:"ab",col,c,ix}}
  return null}
function verMovVinculado(m,o){
  const nom=o.t==="nom",cx=o.col==="cxc";
  openModal(`<div class="muted" style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600">Movimiento vinculado</div>
  <h2 style="margin:4px 0 2px">${esc(m.descripcion||m.categoria)}</h2><div class="muted" style="font-size:13px">${fechaCorta(m.fecha)} · ${esc(m.categoria)} · ${esc(m.metodo)}</div>
  <div class="saldo-box"><span>${m.tipo==="ingreso"?"Ingreso":"Gasto"}</span><b class="num">${C(enC(m))}</b></div>
  <div class="notice" style="margin:0 0 12px"><b>${nom?"Viene de una planilla.":cx?"Viene de un cobro a un cliente.":"Viene de un pago a un proveedor."}</b> Para que todo quede cuadrado, se corrige desde ${nom?"la planilla: al editarla, este gasto se actualiza solo":"el abono: al corregirlo, se actualizan juntos la cuenta y Caja"}.</div>
  <div class="actions"><button class="btn" data-act="close">Cerrar</button>${nom?`<button class="btn pri" data-act="verNomBack" data-id="${o.n.id}">Abrir planilla</button>`:`<button class="btn" data-act="verCuenta" data-col="${o.col}" data-id="${o.c.id}">Ver cuenta</button><button class="btn pri" data-act="editAbono" data-col="${o.col}" data-id="${o.c.id}" data-i="${o.ix}">Corregir ${cx?"cobro":"pago"}</button>`}</div>`)}
function registrarAbono(col,id,monto,fecha,metodo,enCaja,ix,desc){
  const c=S[col][id],cx=col==="cxc";if(!c)return false;monto=r2(monto);
  const edit=ix!==undefined&&ix!==null&&c.abonos&&c.abonos[ix],prev=edit?c.abonos[ix]:null,s=saldo(c)+(prev?+prev.monto||0:0);
  if(!(monto>0)){toast("Escribí un monto mayor a cero");return false}
  if(monto>s+0.005){toast("El monto es mayor que el saldo ("+C(s)+")");return false}
  const ab={monto,fecha:fecha||hoy(),metodo:metodo||"Efectivo"};
  const datosMov={tipo:cx?"ingreso":"gasto",monto,moneda:"NIO",fecha:ab.fecha,metodo:ab.metodo,categoria:cx?"Cobro a clientes":"Pago a proveedores",descripcion:(cx?"Cobro: ":"Pago: ")+c.nombre+(c.concepto?" · "+c.concepto:"")+(desc?" · "+desc:"")};
  if(enCaja){if(prev&&prev.movId&&S.movs[prev.movId]){ab.movId=prev.movId;S.movs[prev.movId]={...S.movs[prev.movId],...datosMov}}
    else{const mid=uid();ab.movId=mid;S.movs[mid]={id:mid,...datosMov,creado:new Date().toISOString()}}}
  else if(prev&&prev.movId&&S.movs[prev.movId])delete S.movs[prev.movId];
  const abonos=[...(c.abonos||[])];if(edit)abonos[ix]=ab;else abonos.push(ab);
  put(col,id,{...c,abonos});
  toast(edit?(cx?"Cobro":"Pago")+" corregido":(cx?"Cobro":"Pago")+" de "+C(monto)+" registrado"+(monto>=s-0.005?" · cuenta saldada":""));return true;
}
function formAbono(col,c,ix){

  openModal(`<div class="muted" style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600">${a?(cx?"Corregir cobro":"Corregir pago"):cx?"Registrar cobro":"Registrar pago"}</div>
  <h2 style="margin:4px 0 2px">${esc(c.nombre)}</h2><div class="muted" style="font-size:13px">${esc(c.concepto||"")}${c.vence?" · vence "+fechaCorta(c.vence):""}</div>
  <div class="saldo-box"><span>${a?"Saldo antes de este abono":"Saldo pendiente"}</span><b class="num">${C(s)}</b>${(c.abonos||[]).length?`<small>${c.abonos.length} abono${c.abonos.length===1?"":"s"} anterior${c.abonos.length===1?"":"es"} · ${C(c.monto-s)} de ${C(c.monto)}</small>`:""}</div>
  <form class="f" id="fAb2">
    <label>¿Cuánto ${cx?"te pagó":"pagaste"}? (C$)<input id="bM" type="number" step="0.01" min="0.01" max="${s}" inputmode="decimal" placeholder="0.00" value="${a?a.monto:""}" required></label>

    <label class="chk"><input type="checkbox" id="bCaja" ${!a||(a.movId&&S.movs[a.movId])?"checked":""}> Anotar también en Caja como ${cx?"ingreso":"gasto"}</label>

    const m=root.querySelector("#bM");if(m&&window.innerWidth>700)m.focus();
  });

function verCuenta(col,c){

  openModal(`<div class="spread"><h2 style="margin:0">${esc(c.nombre)}</h2>${chipEstado(c)}</div>
  <div class="muted" style="font-size:14px;margin-top:4px">${esc(c.concepto||"")}${c.contacto?" · "+esc(c.contacto):""}</div>

  ${s>0.005?`<h3>Registrar ${cx?"cobro":"pago"}</h3><form class="f" id="fAb">
    <div class="two"><label>Monto C$<input id="aM" type="number" step="0.01" min="0.01" max="${s}" value="${s}" required></label><label>Fecha<input id="aF" type="date" value="${hoy()}" required></label></div>

    <div class="actions"><button class="btn pri" type="submit">Registrar ${cx?"cobro":"pago"}</button></div></form>`:""}
  <div class="actions" style="margin-top:14px"><button class="btn" data-act="close">Cerrar</button><button class="btn" data-act="editCuenta" data-col="${col}" data-id="${c.id}">Editar</button><button class="btn" data-act="pdf" data-k="edocta" data-col="${col}" data-id="${c.id}">${ic("pdf")} Estado de cuenta</button></div>`,root=>{

const PDF_SPECIAL={"–":0x96,"—":0x97,"‘":0x91,"’":0x92,"“":0x93,"”":0x94,"•":0x95,"…":0x85,"€":0x80,"−":0x2D};
function pdfCode(ch){const c=ch.charCodeAt(0);if(c<128)return c;if(c>=160&&c<=255)return c;return PDF_SPECIAL[ch]!==undefined?PDF_SPECIAL[ch]:63}
function pdfW(ch,b){const c=ch.charCodeAt(0),T=b?PDF_WB:PDF_WH;if(c>=32&&c<=126)return T[c-32];
  if(ch==="·")return 278;if(ch==="–")return 556;if(ch==="—")return 1000;if("‘’".includes(ch))return 222;if("“”".includes(ch))return 333;if(ch==="•")return 350;if(ch==="…")return 1000;if(ch==="ª"||ch==="º")return 370;
  const base=ch.normalize("NFD")[0];const bc=base.charCodeAt(0);return bc>=32&&bc<=126?T[bc-32]:556}
function pdfTW(s,sz,b){let w=0;for(const ch of String(s))w+=pdfW(ch,b);return w*sz/1000}
function pdfHex(s){let h="";for(const ch of String(s))h+=pdfCode(ch).toString(16).padStart(2,"0");return h}
function pdfFit(s,w,sz,b){s=String(s);if(pdfTW(s,sz,b)<=w)return s;while(s.length>1&&pdfTW(s+"…",sz,b)>w)s=s.slice(0,-1);return s+"…"}
function pdfWrap(s,w,sz,b){const out=[];String(s).split("\n").forEach(par=>{let line="";par.split(/\s+/).forEach(word=>{const t=line?line+" "+word:word;if(pdfTW(t,sz,b)>w&&line){out.push(line);line=word}else line=t});out.push(line)});return out}
function pdfRGB(h){h=h.replace("#","");return [0,2,4].map(i=>(parseInt(h.substr(i,2),16)/255).toFixed(3)).join(" ")}

function PDFDoc(meta){

/* ---------- Categorías propias ---------- */
const GRUPOS_OUT=[["costo","Costo de ventas"],["op","Gasto operativo"],["imp","Impuestos"]];
const GRUPOS_IN=[["ventas","Ventas y servicios"],["otros","Otros ingresos"]];
function catsIn(){return CAT_IN.concat((S.cfg.catsIn||[]).map(c=>c.n).filter(n=>!CAT_IN.includes(n)))}
function catsOut(){return CAT_OUT.concat((S.cfg.catsOut||[]).map(c=>c.n).filter(n=>!CAT_OUT.includes(n)))}
function grupoMov(m){
  if(m.tipo==="ingreso"){if(m.categoria==="Otros ingresos")return "otros";const c=(S.cfg.catsIn||[]).find(x=>x.n===m.categoria);return c&&c.g==="otros"?"otros":"ventas"}
  if(m.categoria==="Compras / inventario"||m.categoria==="Pago a proveedores")return "costo";
  if(m.categoria==="Impuestos")return "imp";
  const c=(S.cfg.catsOut||[]).find(x=>x.n===m.categoria);return c&&["costo","op","imp"].includes(c.g)?c.g:"op";
}

/* ---------- Fechas y períodos de reportes ---------- */
function fmtD(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDias(s,n){const d=parseD(s);d.setDate(d.getDate()+n);return fmtD(d)}
function finMes(m){const [y,mm]=m.split("-").map(Number);return m+"-"+String(new Date(y,mm,0).getDate()).padStart(2,"0")}
const fLarga=s=>{const d=parseD(s);return d.getDate()+" "+MESES[d.getMonth()].slice(0,3).toLowerCase()+" "+d.getFullYear()};
function rpPeriodo(per,ancla,r1,r2){
  const [y,m]=ancla.split("-").map(Number);
  if(per==="trim"){const q=Math.floor((m-1)/3),m1=y+"-"+String(q*3+1).padStart(2,"0"),m3=y+"-"+String(q*3+3).padStart(2,"0");return {d1:m1+"-01",d2:finMes(m3),lbl:"Trimestre "+(q+1)+" · "+MESES[q*3].slice(0,3)+"–"+MESES[q*3+2].slice(0,3)+" "+y,prev:()=>rpPeriodo("trim",addMes(m1,-3))}}
  if(per==="anio")return {d1:y+"-01-01",d2:y+"-12-31",lbl:"Año "+y,prev:()=>rpPeriodo("anio",(y-1)+"-01")};
  if(per==="rango"){let a=r1||ancla+"-01",b=r2||finMes(ancla);if(a>b)[a,b]=[b,a];const n=dias(a,b)+1;return {d1:a,d2:b,lbl:fLarga(a)+" al "+fLarga(b),prev:()=>rpPeriodo("rango",ancla,addDias(a,-n),addDias(a,-1))}}
  return {d1:ancla+"-01",d2:finMes(ancla),lbl:mesLbl(ancla),prev:()=>rpPeriodo("mes",addMes(ancla,-1))};
}
function periodoActual(){const r=S.rp||{per:"mes"};return rpPeriodo(r.per,S.mes,r.d1,r.d2)}
const movsEntre=(d1,d2)=>Object.values(S.movs).filter(m=>m.fecha>=d1&&m.fecha<=d2);

/* ---------- Cálculos financieros ---------- */
function calcER(d1,d2){
  const g={ventas:{},otros:{},costo:{},op:{},imp:{}};
  movsEntre(d1,d2).forEach(m=>{const k=grupoMov(m);g[k][m.categoria]=(g[k][m.categoria]||0)+enC(m)});
  const s=o=>Object.values(o).reduce((a,b)=>a+b,0);
  const t={v:s(g.ventas),o:s(g.otros),c:s(g.costo),op:s(g.op),i:s(g.imp)};
  t.ub=t.v-t.c;t.uo=t.ub-t.op;t.ai=t.uo+t.o;t.un=t.ai-t.i;return {g,t};
}
function lineasER(er){const {g,t}=er,det=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]);
  return [["Ventas y servicios",t.v,"g",det(g.ventas),"v"],["Costo de ventas",-t.c,"g",det(g.costo),"c"],["Utilidad bruta",t.ub,"t",[],"ub"],
    ["Gastos operativos",-t.op,"g",det(g.op),"op"],["Utilidad operativa",t.uo,"t",[],"uo"],["Otros ingresos",t.o,"g",det(g.otros),"o"],
    ["Impuestos",-t.i,"g",det(g.imp),"i"],["Utilidad neta",t.un,"f",[],"un"]]}
function calcFlujo(d1,d2){const r={};METODOS.forEach(k=>r[k]={e:0,s:0});movsEntre(d1,d2).forEach(m=>{const k=r[m.metodo]?m.metodo:"Efectivo";m.tipo==="ingreso"?r[k].e+=enC(m):r[k].s+=enC(m)});return r}
function calcSituacion(){const h=hoy();let caja=0;Object.values(S.movs).forEach(m=>{if(m.fecha<=h)caja+=(m.tipo==="ingreso"?1:-1)*enC(m)});
  const cxc=Object.values(S.cxc).reduce((a,c)=>a+Math.max(0,saldo(c)),0),cxp=Object.values(S.cxp).reduce((a,c)=>a+Math.max(0,saldo(c)),0);
  let vac=0,ag=0,ind=0;Object.values(S.emps).filter(e=>e.activo!==false).forEach(e=>{const p=prestaciones(e);if(p){vac+=p.vacMonto;ag+=p.ag;ind+=p.ind}});
  return {caja,cxc,cxp,vac,ag,ind,neto:caja+cxc-cxp-vac-ag}}
function calcNomAnio(y){const meses={};let T={bruto:0,inss:0,ir:0,pat:0,inatec:0,neto:0,costo:0};
  Object.values(S.noms).filter(n=>(n.periodo||"").startsWith(y+"-")).forEach(n=>{const t=totNom(n.lineas||[]);const k=n.periodo;meses[k]=meses[k]||{bruto:0,inss:0,ir:0,pat:0,inatec:0,neto:0,costo:0};Object.keys(T).forEach(x=>{meses[k][x]+=t[x];T[x]+=t[x]})});
  return {meses,T}}
const pctV=(x,v)=>v>0?(x/v*100).toFixed(1)+" %":"—";

/* ---------- Recordatorios ---------- */
function recordatorios(){
  const h=hoy(),mes=h.slice(0,7),y=+h.slice(0,4),out=[],pag=S.cfg.recPag||{};
  const dm=+finMes(mes).slice(8);
  const fechaDia=d=>mes+"-"+String(Math.min(Math.max(1,+d||1),dm)).padStart(2,"0");
  const cuando=(k,f)=>k<0?"Venció el "+fechaCorta(f):k===0?"Vence hoy":k===1?"Vence mañana":"Vence el "+fechaCorta(f);
  (S.cfg.recs||[]).forEach(r=>{if(pag[r.id]===mes)return;const f=fechaDia(r.dia),k=dias(h,f);if(k<=5)out.push({id:r.id,t:r.t,sub:(+r.monto?C(r.monto)+" · ":"")+cuando(k,f),k,venc:k<0,btn:+r.monto?"Pagado y anotar":"Marcar pagado"})});
  const pm=addMes(mes,-1),np=Object.values(S.noms).filter(n=>n.periodo===pm),tp=totNom(np.reduce((a,n)=>a.concat(n.lineas||[]),[]));
  if(S.cfg.diaINSS&&pag.inss!==mes){const f=fechaDia(S.cfg.diaINSS),k=dias(h,f);if(k<=5)out.push({id:"inss",t:"Pago al INSS · "+mesLbl(pm),sub:(np.length?C(tp.inss+tp.pat)+" (laboral + patronal) · ":"")+cuando(k,f),k,venc:k<0,btn:"Marcar pagado"})}
  if(S.cfg.diaIR&&pag.ir!==mes){const f=fechaDia(S.cfg.diaIR),k=dias(h,f);if(k<=5)out.push({id:"ir",t:"IR retenido a la DGI · "+mesLbl(pm),sub:(np.length?C(tp.ir)+" · ":"")+cuando(k,f),k,venc:k<0,btn:"Marcar pagado"})}
  const act=Object.values(S.emps).filter(e=>e.activo!==false);
  if(act.length&&h>=y+"-11-15"&&h<=y+"-12-10"&&S.cfg.aguiPag!==String(y)){const est=act.reduce((a,e)=>{const p=prestaciones(e);return a+(p?p.ag:0)},0),f=y+"-12-10",k=dias(h,f);out.push({id:"agui",t:"Aguinaldo "+y,sub:"Estimado "+C(est)+" · pagar a más tardar el 10 de diciembre",k,venc:false,btn:"Marcar pagado"})}
  if(act.length&&+h.slice(8)>=25&&!Object.values(S.noms).some(n=>n.periodo===mes))out.push({id:"plan",t:"Planilla de "+mesLbl(mes),sub:"Todavía no la generaste",k:dm-+h.slice(8),venc:false,btn:"Generar",act:"qaPlanilla"});
  return out.sort((a,b)=>(b.venc-a.venc)||(a.k-b.k));
}
function vRecordatorios(){const R=recordatorios(),v=R.filter(r=>r.venc).length;
  const body=R.length?`<div class="list flat">${R.map(r=>`<div class="item"><span class="av" style="--hc:var(${r.venc?"--h-pagar":"--h-panel"})">${ic("reloj")}</span><div class="main"><div class="t">${esc(r.t)}</div><div class="s">${esc(r.sub)}</div></div><button class="btn sm ${r.venc?"pri":""}" data-act="${r.act||"recPag"}" data-id="${r.id}">${r.btn}</button></div>`).join("")}</div>`
    :`<div class="empty" style="padding:8px">No hay pagos pendientes en los próximos 5 días.</div>`;
  return secP("recs","reloj","--h-panel","Recordatorios",R.length?R.length+" pendiente"+(R.length===1?"":"s"):"Sin pagos pendientes",body+`<div class="row" style="margin-top:10px"><button class="btn sm" data-act="irAjRec">Configurar recordatorios</button></div>`,v?v+" vencido"+(v===1?"":"s"):"")}
function marcarRec(id){const mes=hoy().slice(0,7),pag={...(S.cfg.recPag||{})};
  if(id==="agui"){putCfg({...S.cfg,aguiPag:hoy().slice(0,4)});toast("Aguinaldo marcado como pagado");return}
  const r=(S.cfg.recs||[]).find(x=>x.id===id);
  if(r&&+r.monto>0){const mid=uid();S.movs[mid]={id:mid,tipo:"gasto",monto:r2(r.monto),moneda:"NIO",fecha:hoy(),metodo:"Efectivo",categoria:catsOut().includes(r.cat)?r.cat:"Otros gastos",descripcion:r.t,creado:new Date().toISOString()}}
  pag[id]=mes;putCfg({...S.cfg,recPag:pag});toast(r&&+r.monto>0?"Pagado y anotado en caja":"Marcado como pagado");
}

function slug(s){return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"")}
/* ---------- Visor de PDF dentro de la app ---------- */
function pdfTexto(hex){let s="";const R={};Object.entries(PDF_SPECIAL).forEach(([k,v])=>{if(v>=0x80)R[v]=k});for(let i=0;i<hex.length;i+=2){const c=parseInt(hex.substr(i,2),16);s+=R[c]||String.fromCharCode(c)}return s}
function pintarPagina(cv,ops,logoImg,ancho){
  const W=595.28,H=841.89,dpr=Math.min(3,window.devicePixelRatio||2),k=ancho/W;
  cv.width=Math.round(W*k*dpr);cv.height=Math.round(H*k*dpr);cv.style.width=ancho+"px";cv.style.height=Math.round(H*k)+"px";
  const g=cv.getContext("2d");g.setTransform(k*dpr,0,0,k*dpr,0,0);g.fillStyle="#fff";g.fillRect(0,0,W,H);
  const rgb=(r,gg,b)=>`rgb(${Math.round(r*255)},${Math.round(gg*255)},${Math.round(b*255)})`;let m;
  ops.forEach(op=>{
    if((m=op.match(/^BT \/(F[12]) ([\d.]+) Tf ([\d.]+) ([\d.]+) ([\d.]+) rg ([-\d.]+) ([-\d.]+) Td <([0-9a-f]*)> Tj ET$/))){g.font=(m[1]==="F2"?"bold ":"")+m[2]+'px Helvetica, Arial, sans-serif';g.fillStyle=rgb(+m[3],+m[4],+m[5]);g.fillText(pdfTexto(m[8]),+m[6],H-+m[7]);return}

      (tipo!=="g"?`<div class="erl cmp"><span>Período anterior: ${C(pvv)}</span><span>${dlt===null?"":(dlt>=0?"▲ ":"▼ ")+Math.abs(dlt).toFixed(1)+" %"}</span></div>`:"")}).join("");
  const f=calcFlujo(P.d1,P.d2),s=calcSituacion(),y=P.d1.slice(0,4),na=calcNomAnio(y);
  const pdfB=(k,l)=>`<button class="btn sm" data-act="pdf" data-k="${k}">${ic("pdf")} ${l||"PDF"}</button>`;
  return `${heroMod("reportes","Reportes financieros",esc(P.lbl),C(er.t.un),[["Ventas",C(v)],["Margen neto",pctV(er.t.un,v)],["Utilidad bruta",C(er.t.ub)],["Gastos",C(er.t.c+er.t.op+er.t.i)]],"rep")}
  <div class="seg" style="display:inline-flex;margin-bottom:10px">${[["mes","Mes"],["trim","Trimestre"],["anio","Año"],["rango","Rango"]].map(([k,l])=>`<button data-act="rpPer" data-k="${k}" class="${r.per===k?"on":""}">${l}</button>`).join("")}</div>
  ${r.per==="rango"?`<form class="f two" id="fRango" style="margin-bottom:10px"><label>Desde<input type="date" id="rpD1" value="${P.d1}"></label><label>Hasta<input type="date" id="rpD2" value="${P.d2}"></label></form>`:`<div class="muted" style="font-size:12px;margin:-4px 0 10px">Usá las flechas de arriba para cambiar de ${r.per==="anio"?"año":r.per==="trim"?"trimestre":"mes"}.</div>`}
  <div class="panel er">
    <div class="spread" style="margin-bottom:6px"><b style="font-size:15px">Estado de resultados</b>${pdfB("er")}</div>
    <div class="erl hd"><span>Concepto</span><span>Monto</span><span class="pc">% ventas</span></div>
    ${erRows}
    <div class="muted" style="font-size:11.5px;margin-top:8px">Calculado con los movimientos de Caja (base de efectivo). Compras e inventario y pagos a proveedores cuentan como costo de ventas.</div>
  </div>
  ${secP("flujo","caja","--h-caja","Flujo de efectivo","Neto "+C(METODOS.reduce((a,k)=>a+f[k].e-f[k].s,0))+" · por forma de pago",`<div class="tbl" style="box-shadow:none;border-bottom:1px solid var(--line)"><table><tr><th>Forma</th><th>Entradas</th><th>Salidas</th><th>Neto</th></tr>${METODOS.map(k=>`<tr><td>${k}</td><td>${C(f[k].e)}</td><td>${C(f[k].s)}</td><td>${C(f[k].e-f[k].s)}</td></tr>`).join("")}</table></div><div class="row" style="margin-top:10px">${pdfB("flujo")}</div>`)}
  ${secP("sit","grafico","--h-cobrar","Situación del negocio","Posición neta "+C(s.neto),`<div class="lines">
    <div class="spread"><span>Efectivo y bancos (según registros)</span><span class="num">${C(s.caja)}</span></div>
    <div class="spread"><span>Te deben</span><span class="num in-c">${C(s.cxc)}</span></div>
    <div class="spread"><span>Debés</span><span class="num out-c">− ${C(s.cxp)}</span></div>
    <div class="spread"><span>Vacaciones acumuladas</span><span class="num out-c">− ${C(s.vac)}</span></div>
    <div class="spread"><span>Aguinaldo acumulado</span><span class="num out-c">− ${C(s.ag)}</span></div>
    <div class="spread b"><span>Posición neta estimada</span><span class="num">${C(s.neto)}</span></div></div>
    <div class="muted" style="font-size:12px;margin-top:6px">Indemnización acumulada (solo si el empleador termina el contrato): ${C(s.ind)}.</div><div class="row" style="margin-top:10px">${pdfB("sit")}</div>`)}
  ${secP("nanio","nomina","--h-nomina","Nómina del año "+y,"Costo "+C(na.T.costo)+" · INSS "+C(na.T.inss+na.T.pat),`<div class="lines">
    <div class="spread"><span>Salarios brutos</span><span class="num">${C(na.T.bruto)}</span></div>
    <div class="spread"><span>INSS laboral retenido</span><span class="num">${C(na.T.inss)}</span></div>
    <div class="spread"><span>INSS patronal</span><span class="num">${C(na.T.pat)}</span></div>
    <div class="spread"><span>IR retenido</span><span class="num">${C(na.T.ir)}</span></div>
    <div class="spread"><span>INATEC</span><span class="num">${C(na.T.inatec)}</span></div>
    <div class="spread b"><span>Costo total</span><span class="num">${C(na.T.costo)}</span></div></div><div class="row" style="margin-top:10px">${pdfB("nomanio")}</div>`)}
  <button class="btn pri" data-act="pdf" data-k="rep" style="width:100%;margin-top:4px">${ic("pdf")} Informe financiero completo en PDF</button>`;
}

/* ---------- Arranque ---------- */
S.mode="local";S.gate="cargando";loadLocal();render();
licInit().then(render);
document.addEventListener("visibilitychange",async()=>{if(document.visibilityState==="visible"){const was=S.gate;await licInit();if(S.gate!==was||S.gate!=="ok")render()}});
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
})();
</script>
</body>
</html>
