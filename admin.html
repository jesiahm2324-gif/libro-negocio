async function copy(t,ok){try{await navigator.clipboard.writeText(t);toast(ok)}catch(e){toast("No se pudo copiar. Mantené presionado el texto para copiarlo.")}}

async function dec(blob,pass){const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:unb(blob.s),iterations:600000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb(blob.iv)},k,unb(blob.ct));return JSON.parse(new TextDecoder().decode(pt))}
async function enc(jwk,pass){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:600000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["encrypt"]);
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,new TextEncoder().encode(JSON.stringify(jwk)));return{s:b64(salt),iv:b64(iv),ct:b64(new Uint8Array(ct))}}

let PRV=null,PRVG=null,reg=[],open=null,q=""
let APP="negocio";try{APP=localStorage.getItem("ln_app")||"negocio"}catch(e){}
const APPC={negocio:"#0F8A6A",porcina:"#DB2777",tambo:"#2F7D4F"};
const regApp=()=>reg.filter(r=>appDe(r)===APP);
function resApp(k){if(k==="tambo"&&!PRVT)return `<span class="vv">Por vincular</span>`;const n=reg.filter(r=>appDe(r)===k).length,v=reg.filter(r=>appDe(r)===k&&r.e&&dd(r.e,today())<0).length;return `${n} cliente${n===1?"":"s"}${v?` · <span class="vv">${v} vencido${v===1?"":"s"}</span>`:""}`};
let OPEN=new Set();try{OPEN=new Set(JSON.parse(LS("ln_open")||"[]"))}catch(e){}
function openSec(k,on){const el=$("sec-"+k);if(!el)return;el.classList.toggle("op",on);if(on)OPEN.add(k);else OPEN.delete(k);LS("ln_open",JSON.stringify([...OPEN]))}
function toggleSec(k){openSec(k,!$("sec-"+k).classList.contains("op"))}
const loadReg=()=>{try{reg=JSON.parse(LS("ln_reg")||"[]")||[]}catch(e){reg=[]}};
const saveReg=()=>LS("ln_reg",JSON.stringify(reg));

const TEMAS=[["auto","Automático","Según el teléfono",["#F3F5F2","#0E6B57","#101614","#4CC4A4"]],["claro","Claro luminoso","Blanco, colores vivos",["#FFFFFF","#F5F7FA","#4F46E5","#0E7C86"]],["oscuro","Oscuro premium","Negro y dorado",["#0E0F12","#17191D","#D4AF5A","#3CC6CF"]],["esmeralda","Esmeralda y oro","Como el ícono",["#0B2A21","#10372C","#D4AF5A","#F3EDDF"]]];
function aplicarTema(){const t=LS("ln_tema")||"esmeralda",r=document.documentElement;if(t==="auto")delete r.dataset.tema;else r.dataset.tema=t;
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=getComputedStyle(document.body).getPropertyValue("--bg").trim()||"#13201B"}
function pintarTemas(){const t=LS("ln_tema")||"esmeralda";if(!$("temas"))return;
  $("temas").innerHTML=TEMAS.map(([k,n,d,c])=>`<button class="tema ${t===k?"on":""}" data-tema="${k}" aria-pressed="${t===k}"><span class="sw">${c.map(x=>`<i style="background:${x}"></i>`).join("")}</span><span><b>${n}</b><br><small>${d}</small></span></button>`).join("");
  $("apas").textContent=TEMAS.find(x=>x[0]===t)[1];
  $("temas").querySelectorAll("[data-tema]").forEach(b=>b.onclick=()=>{LS("ln_tema",b.dataset.tema);aplicarTema();pintarTemas();toast("Apariencia cambiada")})}
function lock(){
  aplicarTema();
  $("m").innerHTML=`<div class="lockbox"><div class="eyebrow">Libro del Negocio · Granja Porcina · Mi Tambo</div><h1>Administrador</h1><p class="sub">Un solo acceso para generar los códigos de todas tus apps</p>
  ${avisoSafari()}<form class="panel" id="fl" action="#" autocomplete="on"><label>Usuario<input id="us" name="username" type="text" autocomplete="username" value="Administrador de mis apps" readonly></label><label>Contraseña de administrador<input id="pw" name="password" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required></label><div class="err" id="er"></div><button class="btn pri full" id="go" type="submit">Entrar</button></form></div>`;
  $("fl").onsubmit=async e=>{e.preventDefault();$("go").textContent="Verificando…";$("er").textContent="";
    const pw=$("pw").value.trim();let saved=null;try{saved=JSON.parse(LS("ln_blob")||"null")}catch(x){}
    for(const b of [saved,BLOB]){if(!b)continue;try{PRV=await dec(b,pw)}catch(x){continue}try{PRVG=await abrirGranja(PRV)}catch(x){PRVG=null}try{PRVT=await abrirTambo(PRV)}catch(x){PRVT=null}main();return}
    $("go").textContent="Entrar";$("er").textContent="Contraseña incorrecta. Si la cambiaste y no la recordás, usá la contraseña original del administrador.";};
}

function status(e){if(!e)return["Sin vencimiento","ok"];const d=dd(e,today());return d<0?["Vencido","bad"]:d<=15?["Vence en "+d+" d","warn"]:["Activo · "+d+" d","ok"]}

function main(){loadReg();if(!APPS[APP])APP="negocio";
  $("m").innerHTML=`<div class="top"><div><div class="eyebrow">Administrador de accesos</div><h1>Códigos de activación</h1></div><button class="btn sm" id="out2">Salir</button></div>
  <div class="apps" role="tablist" aria-label="App">${Object.keys(APPS).map(k=>`<button role="tab" aria-selected="${APP===k}" class="appb ${APP===k?"on":""}" data-app="${k}" style="--ac:${APPC[k]}"><b>${esc(APPS[k].n)}</b><small>${resApp(k)}</small></button>`).join("")}</div>
  <div class="apph"><i></i>Estás viendo los accesos de <b>${esc(APPS[APP].n)}</b></div>
  <div class="kp" id="kp"></div>
  <div class="acc" id="sec-gen"><button class="ah" data-sec="gen"><span class="ai">＋</span><span class="at"><b id="ft">Nuevo código o renovación</b><small>${APP==="tambo"&&!PRVT?"Primero vinculá Mi Tambo (una sola vez)":"Para "+esc(APPS[APP].n)+" · con el ID del cliente"}</small></span><span class="chev">›</span></button>
  <div class="ab">
  ${APP==="tambo"&&!PRVT?`<form class="link stack" id="fvt" action="#" autocomplete="on"><h3>Vincular Mi Tambo (una sola vez)</h3>
    <div class="hint">Escribí la contraseña que usabas en el Admin de Mi Tambo. Queda guardada protegida en este teléfono y desde ahí entrás a todo con tu contraseña de siempre.</div>
    <input type="text" name="username" autocomplete="username" value="Admin Mi Tambo" readonly hidden>
    <label>Contraseña del Admin de Mi Tambo<input id="tpw" name="password" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required></label>
    <div class="err" id="ter"></div><button class="btn pri full" id="tgo" type="submit">Vincular Mi Tambo</button></form>`:""}
  <form class="stack" id="fg" ${APP==="tambo"&&!PRVT?"hidden":""}>
    <label hidden>App<select id="ap"><option value="negocio">Libro del Negocio</option><option value="porcina">Mi Granja Porcina</option><option value="tambo">Mi Tambo</option></select></label>
    <label>Nombre del cliente o negocio<input id="n" maxlength="60" placeholder="Ej.: Pulpería La Esperanza" required></label>
    <label>ID del teléfono (lo envía el cliente)<input id="d" placeholder="XXXX-XXXX" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" required></label>
    <label>Tiempo de acceso<select id="t">
      <option value="1">1 mes</option><option value="3">3 meses</option><option value="6">6 meses</option><option value="12" selected>1 año</option><option value="24">2 años</option><option value="0">Sin vencimiento</option><option value="x">Elegir fecha exacta</option>
    </select></label>
    <input type="date" id="x" hidden>
    <div class="hint" id="vf"></div>
    <div class="err" id="er"></div>
    <button class="btn pri full" type="submit">Generar código</button>
  </form>
  <div id="out"></div></div></div>
  <div class="acc" id="sec-cli"><button class="ah" data-sec="cli"><span class="ai">≡</span><span class="at"><b id="ch">Clientes (${regApp().length})</b><small id="chs"></small></span><span class="chev">›</span></button>
  <div class="ab"><input id="q" placeholder="Buscar por nombre o ID" autocomplete="off" value="${esc(q)}"><div class="list" id="lst" style="margin-top:8px"></div></div></div>
  <div class="acc" id="sec-inv"><button class="ah" data-sec="inv"><span class="ai wa">↗</span><span class="at"><b>Invitar a un cliente</b><small>Enlace de la app y pasos para instalarla</small></span><span class="chev">›</span></button>
  <div class="ab stack">
    <div class="hint">Mandalo antes del código: el cliente instala la app, te envía su ID y vos le devolvés el código.</div>
    ${[APP].map(k=>`<div class="stack" style="gap:8px"><b>${esc(APPS[k].n)}</b><div class="code">${esc(APPS[k].url)}</div>
    <div class="row"><button class="btn wa" data-inv="${k}">Enviar por WhatsApp</button><button class="btn" data-invc="${k}">Copiar invitación</button></div></div>`).join('<div style="border-top:1px dashed var(--line)"></div>')}
  </div></div>
  <div class="acc" id="sec-apa"><button class="ah" data-sec="apa"><span class="ai">◐</span><span class="at"><b>Apariencia</b><small id="apas"></small></span><span class="chev">›</span></button>
  <div class="ab"><div class="temas" id="temas"></div></div></div>
  <div class="acc" id="sec-reg"><button class="ah" data-sec="reg"><span class="ai gold">⚿</span><span class="at"><b>Registro y contraseña</b><small>Respaldo, importar y cambiar clave</small></span><span class="chev">›</span></button>
  <div class="ab stack">
      <div class="hint">El registro de clientes de las 3 apps vive solo en este teléfono. Copiá el respaldo y guardalo en Notas. Para pasar tus ganaderos del Admin viejo de Mi Tambo: allá tocá «Copiar respaldo del registro» y pegalo aquí; cada código se ubica solo en su app.</div>
      <div class="row"><button class="btn" id="ex">Copiar respaldo del registro</button></div>
      <label>Importar registro (pegá el respaldo)<textarea id="imt" rows="2"></textarea></label>
      <div class="row"><button class="btn" id="im">Importar</button></div>
      <label>Nueva contraseña (mínimo 12 caracteres)<input id="np" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Escribí una que puedas recordar"></label>
      <div class="hint">Anotala antes de guardarla. La contraseña original del administrador sigue sirviendo como respaldo.</div>
      <div class="row"><button class="btn" id="pwc">Cambiar contraseña en este teléfono</button></div>
  </div></div>`;
  if($("fvt"))$("fvt").onsubmit=async e=>{e.preventDefault();$("tgo").textContent="Verificando…";$("ter").textContent="";
    try{await vincularTambo($("tpw").value.trim());toast("Mi Tambo quedó vinculado");OPEN.add("gen");main()}
    catch(x){$("tgo").textContent="Vincular Mi Tambo";$("ter").textContent="Esa no es la contraseña de Mi Tambo. Si la cambiaste en su Admin, probá con la contraseña original."}};
  $("ap").value=APP;$("m").style.setProperty("--c-gen",APPC[APP]);$("m").style.setProperty("--appc",APPC[APP]);
  document.querySelectorAll("[data-app]").forEach(b=>b.onclick=()=>{if(APP===b.dataset.app)return;APP=b.dataset.app;try{localStorage.setItem("ln_app",APP)}catch(e){};open=null;q="";main();toast("Mostrando "+APPS[APP].n)});
  document.querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>toggleSec(b.dataset.sec));
  OPEN.forEach(k=>openSec(k,true));
  pintarTemas();
  const curDe=()=>reg.find(r=>r.d===cleanId()&&appDe(r)===$("ap").value);
  const exp=()=>{const v=$("t").value,cur=curDe();const base=cur&&cur.e&&cur.e>today()?cur.e:today();return v==="0"?"":v==="x"?$("x").value:addM(base,+v)};
  const vf=()=>{$("x").hidden=$("t").value!=="x";const e=exp(),cur=curDe();
    $("vf").textContent=$("t").value==="0"?"El acceso no vence.":e?("Vence el "+fmt(e)+(cur&&cur.e&&cur.e>today()&&$("t").value!=="x"?" (se suma a lo que le quedaba)":"")):"";};
  $("t").onchange=vf;$("x").onchange=vf;$("d").oninput=vf;$("ap").onchange=vf;vf();
  $("fg").onsubmit=async e=>{e.preventDefault();$("er").textContent="";
    const n=$("n").value.trim(),d=cleanId(),ex=exp(),a=$("ap").value;
    const K=a==="porcina"?PRVG:a==="tambo"?PRVT:PRV;
    if(!K){$("er").textContent=a==="tambo"?"Primero vinculá Mi Tambo con su contraseña.":"No se pudo abrir la llave de esta app. Salí y volvé a entrar con tu contraseña.";return}
    if(!n){$("er").textContent="Escribí el nombre.";return}
    if(!/^[A-Z0-9]{8}$/.test(d)){$("er").textContent="El ID debe tener 8 letras o números (XXXX-XXXX).";return}
    if($("t").value==="x"&&(!ex||ex<today())){$("er").textContent="Elegí una fecha futura.";return}
    const p=b64u(new TextEncoder().encode(JSON.stringify(a==="porcina"?{n,d,e:ex,a}:{n,d,e:ex})));
    const key=await crypto.subtle.importKey("jwk",a==="negocio"?K:cleanK(K),{name:"ECDSA",namedCurve:"P-256"},false,["sign"]);
    const sg=await crypto.subtle.sign({name:"ECDSA",hash:"SHA-256"},key,new TextEncoder().encode(p));
    const code=p+"."+b64u(sg);
    reg=reg.filter(r=>!(r.d===d&&appDe(r)===a));const r={n,d,e:ex,code,at:today(),a};reg.push(r);saveReg();
    $("fg").reset();$("ap").disabled=false;$("ap").value=APP;$("t").value="12";vf();$("ft").textContent="Nuevo código o renovación";
    show(r);list();kp()};
  $("q").oninput=()=>{q=$("q").value;list()};
  const invTxt=k=>`Hola, te invito a usar *${APPS[k].n}* para ${APPS[k].para}.

1. Abrí este enlace en Safari (iPhone) o Chrome (Android): ${APPS[k].url}
2. Instalala: en iPhone tocá Compartir → "Agregar a pantalla de inicio". En Android tocá ⋮ → "Instalar app" o "Agregar a pantalla principal".
3. Abrí la app desde el ícono nuevo. Te va a mostrar tu ID: mandámelo para enviarte tu código de activación.`;
  document.querySelectorAll("[data-inv]").forEach(b=>b.onclick=()=>{location.href="https://wa.me/?text="+encodeURIComponent(invTxt(b.dataset.inv))});
  document.querySelectorAll("[data-invc]").forEach(b=>b.onclick=()=>copy(invTxt(b.dataset.invc),"Invitación copiada"));
  $("ex").onclick=()=>copy(JSON.stringify(reg),"Respaldo copiado. Pegalo en Notas.");
  $("im").onclick=async()=>{let a;try{a=JSON.parse($("imt").value);if(!Array.isArray(a))throw 0}catch(e){toast("El texto no es un registro válido");return}
    const nuevos=a.filter(r=>r&&r.d&&r.code);const cnt={};
    for(const r of nuevos){r.a=await appDeCodigo(r);cnt[r.a]=(cnt[r.a]||0)+1}
    const mp={};[...reg,...nuevos].forEach(r=>{mp[rk(r)]=r});reg=Object.values(mp);saveReg();
    toast(nuevos.length?"Importado: "+Object.keys(cnt).map(k=>cnt[k]+" de "+APPS[k].n).join(", "):"No había códigos para importar");main()};
  $("pwc").onclick=async()=>{const p=$("np").value.trim();if(p.length<12){toast("Usá al menos 12 caracteres");return}LS("ln_blob",JSON.stringify(await enc(PRV,p)));$("np").value="";toast("Contraseña cambiada en este teléfono. Anotala.")};
  $("out2").onclick=()=>{PRV=null;PRVG=null;PRVT=null;lock()};
  kp();list();
}
const cleanId=()=>($("d").value||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
function kp(){const a=regApp().filter(r=>!r.e||dd(r.e,today())>15).length,p=regApp().filter(r=>r.e&&dd(r.e,today())>=0&&dd(r.e,today())<=15).length,v=regApp().filter(r=>r.e&&dd(r.e,today())<0).length;
  $("kp").innerHTML=`<div><div class="l">Activos</div><div class="v">${a}</div></div><div><div class="l">Por vencer</div><div class="v">${p}</div></div><div><div class="l">Vencidos</div><div class="v">${v}</div></div>`}
function msgCode(r){return `Tu código de activación de ${APPS[appDe(r)].n} (${r.n})${r.e?", válido hasta el "+fmt(r.e):", sin vencimiento"}:

${r.code}

Copialo completo y pegalo en la app, en "Código de activación".`}
function show(r){const [t,k]=status(r.e);
  openSec("gen",true);
  $("out").innerHTML=`<div class="result stack">
    <div class="spread"><b>${esc(r.n)}</b><span class="chip ${k}">${t}</span></div>
    <div class="hint">${esc(APPS[appDe(r)].n)} · ID ${devFmt(r.d)} · ${r.e?"vence el "+fmt(r.e):"sin vencimiento"}</div>
    <div class="code">${esc(r.code)}</div>
    <div class="row"><button class="btn wa" id="wa">Enviar por WhatsApp</button><button class="btn" id="cp">Copiar código</button></div></div>`;
  $("wa").onclick=()=>{location.href="https://wa.me/?text="+encodeURIComponent(msgCode(r))};
  $("cp").onclick=()=>copy(r.code,"Código copiado");
  $("out").scrollIntoView({behavior:"smooth",block:"start"})}
function list(){
  document.querySelectorAll(".appb").forEach(b=>{const sm=b.querySelector("small");if(sm)sm.innerHTML=resApp(b.dataset.app)});
  if($("ch"))$("ch").textContent="Clientes ("+regApp().length+")";
  if($("chs")){const v=regApp().filter(r=>r.e&&dd(r.e,today())<0).length,pv=regApp().filter(r=>r.e&&dd(r.e,today())>=0&&dd(r.e,today())<=15).length;$("chs").textContent=regApp().length?[pv?pv+" por vencer":"",v?v+" vencido"+(v==1?"":"s"):""].filter(Boolean).join(" · ")||"Todos al día":"Todavía no generaste códigos"}
  const L=[...regApp()].sort((a,b)=>(a.e||"9999").localeCompare(b.e||"9999")).filter(r=>!q||(r.n+" "+r.d+" "+devFmt(r.d)+" "+APPS[appDe(r)].n).toLowerCase().includes(q.toLowerCase()));
  $("lst").innerHTML=L.map(r=>{const [t,k]=status(r.e);return `<div class="cli ${open===rk(r)?"op":""}"><button class="head" data-o="${rk(r)}"><div class="main"><div class="t">${esc(r.n)}</div><div class="s">${esc(APPS[appDe(r)].n)} · ${devFmt(r.d)} · ${r.e?"vence "+fmt(r.e):"sin vencimiento"}</div></div><span class="chip ${k}">${t}</span></button>
    <div class="acts row"><button class="btn sm" data-re="${rk(r)}">Renovar</button><button class="btn sm" data-sh="${rk(r)}">Ver código</button><button class="btn sm danger" data-rm="${rk(r)}">Quitar</button></div></div>`}).join("")||`<div class="empty">${reg.length?"Sin resultados.":"Todavía no generaste códigos. Cuando un cliente te mande su ID, completá el formulario de arriba."}</div>`;
  $("lst").querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{open=open===b.dataset.o?null:b.dataset.o;list()});
  $("lst").querySelectorAll("[data-re]").forEach(b=>b.onclick=()=>{const r=reg.find(x=>rk(x)===b.dataset.re);$("ap").value=appDe(r);$("ap").disabled=true;$("n").value=r.n;$("d").value=devFmt(r.d);$("t").value="12";$("t").onchange();$("ft").textContent="Renovar a "+r.n;openSec("gen",true);$("sec-gen").scrollIntoView({behavior:"smooth"})});
  $("lst").querySelectorAll("[data-sh]").forEach(b=>b.onclick=()=>show(reg.find(x=>rk(x)===b.dataset.sh)));
  $("lst").querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{if(!b.dataset.armed){b.dataset.armed="1";b.textContent="Tocá de nuevo para quitar";return}reg=reg.filter(x=>rk(x)!==b.dataset.rm);saveReg();toast("Quitado. El código entregado sigue sirviendo hasta su fecha.");main()});
}
lock();
})();
</script>
